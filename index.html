<html lang="en">
<head>
<meta charset="utf-8" />

<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--accent2:#2563eb;--ok:#15803d;--warn:#b45309;--danger:#b91c1c;--soft:#eef2ff;--radius:18px}
*{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);padding-bottom:86px}
button,input,select,textarea{font:inherit} button{cursor:pointer;border:0}.top{position:sticky;top:0;z-index:10;background:rgba(243,244,246,.94);backdrop-filter:blur(12px);padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;font-size:20px}.sub{font-size:12px;color:var(--muted)}
.container{max-width:760px;margin:0 auto;padding:14px}.view{display:none}.view.active{display:block}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:0 3px 12px rgba(17,24,39,.04)}
.h1{font-size:25px;font-weight:800;margin:6px 0}.h2{font-size:17px;font-weight:750;margin:0 0 8px}.muted{color:var(--muted)}.tiny{font-size:12px}.pill{padding:5px 9px;border-radius:999px;background:#f3f4f6;font-size:12px;color:#4b5563}.pill.ok{background:#ecfdf5;color:var(--ok)}.pill.warn{background:#fffbeb;color:var(--warn)}
.btn{padding:11px 13px;border-radius:13px;background:#fff;border:1px solid var(--line);font-weight:700}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.blue{background:var(--accent2);color:#fff;border-color:var(--accent2)}.btn.danger{color:#fff;background:var(--danger)}.btn.small{padding:8px 10px;font-size:13px}.btn.ghost{background:transparent}.iconbtn{width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.tab{padding:10px;border-radius:12px;background:#e5e7eb;font-weight:700;color:#4b5563}.tab.active{background:#111827;color:#fff}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding:8px max(10px,env(safe-area-inset-left)) max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.nav{background:#fff;padding:8px 4px;border-radius:11px;color:#6b7280;font-size:11px;font-weight:700}.nav.active{background:#eef2ff;color:#111827}
.exercise{margin-bottom:12px}.exercise-head{display:flex;gap:8px;align-items:flex-start}.exercise-title{font-weight:800;flex:1}.sets{margin-top:10px;border:1px solid var(--line);border-radius:14px;overflow:hidden}.setrow{display:grid;grid-template-columns:32px 1fr 1fr 54px;gap:6px;align-items:center;padding:8px;border-bottom:1px solid var(--line)}.setrow:last-child{border-bottom:0}.setnum{font-size:12px;color:var(--muted);text-align:center}.input{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:10px;background:#fff}.input:focus{outline:2px solid #c7d2fe;border-color:#818cf8}.setstatus{font-size:11px;text-align:right;color:var(--muted)}
.sticky-actions{position:sticky;bottom:78px;z-index:8;padding:8px 0}.logbig{width:100%;padding:15px;border-radius:16px;background:#111827;color:#fff;font-weight:850;font-size:16px;box-shadow:0 8px 20px rgba(17,24,39,.18)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px}.kpi .v{font-size:22px;font-weight:850}.kpi .l{font-size:12px;color:var(--muted)}
.chart{width:100%;height:210px;border:1px solid var(--line);border-radius:14px;background:#fff}.chart svg{width:100%;height:100%}.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:7px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.list{display:flex;flex-direction:column;gap:8px}.listrow{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border-bottom:0}.value{text-align:right;font-weight:750}
.toggle{display:inline-flex;align-items:center;gap:8px}.toggle input{width:20px;height:20px}.program-row{display:grid;grid-template-columns:1.1fr 1.6fr .55fr .8fr .9fr;gap:6px;align-items:center;margin:7px 0}.program-row .input{padding:8px}.section-title{margin:18px 0 8px;font-size:14px;font-weight:800;color:#374151}.program-card{padding:12px;border:1px solid var(--line);border-radius:14px;margin:8px 0;background:#fff}.danger-outline{color:var(--danger);background:#fff1f2;border-color:#fecaca}.note{background:#f8fafc;border:1px solid var(--line);padding:10px;border-radius:12px;font-size:12px;color:#4b5563}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}.grid2{grid-template-columns:repeat(2,1fr)}.bottom{max-width:760px;left:50%;transform:translateX(-50%);border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:18px 18px 0 0}}
.modal{position:fixed;inset:0;z-index:50;background:rgba(17,24,39,.5);display:flex;align-items:flex-end;justify-content:center}.modal.hidden{display:none}.modal-card{width:min(760px,100%);background:#fff;border-radius:20px 20px 0 0;padding:18px;box-shadow:0 -10px 30px rgba(0,0,0,.2)}.auth-grid{display:grid;gap:10px}.statusbar{margin:10px 0;padding:10px 12px;border-radius:12px;background:#f8fafc;border:1px solid var(--line);font-size:12px}.statusbar.ok{background:#ecfdf5;border-color:#bbf7d0;color:#166534}.statusbar.warn{background:#fffbeb;border-color:#fde68a;color:#92400e}</style></head>
<body>
<header class="top"><div class="topbar"><div><div class="brand">Workout Tracker</div><div class="sub" id="headerSub">Ready for your next session</div></div><button class="iconbtn" id="settingsBtn" aria-label="Settings">⚙️</button></div></header>
<main class="container">

<div id="authModal" class="modal hidden"></div>
<nav class="bottom"><button class="nav active" data-view="workout">Workout</button><button class="nav" data-view="dashboard">Progress</button><button class="nav" data-view="history">History</button><button class="nav" data-view="program">Program</button></nav>
<script>

window.WORKOUT_CONFIG = {
  supabaseUrl: 'https://vqqpexiteaztwgjqzplf.supabase.co',
  supabaseKey: 'sb_publishable_JWXnWDbqCCRGpW7dJKajJw_0Kp0UW5C'
};

</script><script>
const PROGRAM = [
 {key:'Squat',name:'Squat',exercises:[
  ['Foam Rolling W/U','','','',0],['Lateral jumps x10 per side','2','plyo warmup','',0],['A1 Barbell Squat','','','',0],['B1 Barbell Squat','1','AMRAP @65%','',0],['C1 Romanian DLs','3','','',0],['C2 Single Leg Squat','','6-8 e/s','BW',0],['C2 Side Plank w/Banded Clamshell','2','','BW',0],['Core of choice','3','10-20','',0]
 ]},
 {key:'Bench',name:'Bench',exercises:[
  ['10 mins mobility','','','',0],['A1 DB/BB Bench Press','3','week ','',0],['B1 BB Bench Press','1','AMRAP','65% of 1rm',0],['C1 Bent over DB Row','5','10','',2.5],['C2 YTW on 20 deg bench incline','3','10-12 per','',5],['D1 Tricep Extension','2','15+','',0],['D2 Front Raise DBs','','15+','',0],['E1 Hollow Hold Crunch (supine reach)','2','','',0]
 ]},
 {key:'Deadlift',name:'Deadlift',exercises:[
  ['10 mins mobility','','','',0],['A1 Deadlift','3','whichever week','',0],['B1 Deadlift AMRAP','1','','',0],['C1 DB Bulgarian Split Squat','3','5-8 per/','heavy/3s down',2.5],['Leg Press','3','10','',5],['C2 Incline Bicep Curl','2','','',2.5],['C3 Hollow Hold','','30s','',0],['D1 Prone W pull w/small weights','2','15','',0]
 ]},
 {key:'Shoulders',name:'Shoulders',exercises:[
  ['10 mins mobility','','','',0],['A1 DB Shoulder Press (neutral)','4','','',2.5],['A2 Bent Over DB Single Arm Row','','10','',2.5],['B1 Close Grip Bench (DB or BB)','3','10','3010 tempo',2.5],['B2 Pushups','','10','BW',0],['C1 Incline DB Chest Flyes','2-3','','',2.5],['C2 Bird Dog holds','','5x per side 5s','BW',0],['Other core of choice','','','',0]
 ]}
].map(r=>({...r, exercises:r.exercises.map((e,i)=>({name:e[0],sets:e[1],reps:e[2],target:e[3],inc:e[4],active:true,id:`${r.key}-${i}`,targetWeights:[],progression:'last'}))}));

function normalizeProgram(program){
  const rows=Array.isArray(program)?program:PROGRAM;
  return rows.map((r,ri)=>({
    key:r.key||`routine-${ri}-${uid().slice(0,5)}`,
    name:r.name||`Routine ${ri+1}`,
    exercises:(r.exercises||[]).map((e,ei)=>({
      id:e.id||`${r.key||'routine'}-${ei}-${uid().slice(0,5)}`,
      name:e.name??'', sets:e.sets??'', reps:e.reps??'', target:e.target??'', inc:Number(e.inc)||0,
      active:e.active!==false, targetWeights:Array.isArray(e.targetWeights)?e.targetWeights.map(Number).filter(n=>!Number.isNaN(n)):parseWeights(e.targetWeights),
      progression:e.progression||'last'
    }))
  }));
}
function parseWeights(v){if(Array.isArray(v))return v.map(Number).filter(n=>!Number.isNaN(n));return String(v??'').split(',').map(x=>Number(x.trim())).filter(n=>!Number.isNaN(n)&&xNotBlank(x));}
function xNotBlank(x){return String(x).trim()!=='';}
function stepCount(ex){const m=String(ex.sets||'').match(/\d+/);return Math.max(Number(m?.[0])||0,ex.targetWeights?.length||0,3);}
const storedProgram=(()=>{try{return JSON.parse(localStorage.getItem('wt-program')||'null')}catch(e){return null}})();
const state={routine:localStorage.getItem('wt-routine')||'Squat',draft:JSON.parse(localStorage.getItem('wt-draft')||'{}'),program:normalizeProgram(storedProgram||PROGRAM)};
let db=null; let storageFallback=false; let supabase=null; let cloudReady=false; let currentUser=null; let cloudSyncing=false;
const LOCAL_SESSIONS_KEY='wt-sessions';
if(window.WORKOUT_CONFIG && window.WORKOUT_CONFIG.supabaseUrl && !window.WORKOUT_CONFIG.supabaseUrl.includes('YOUR-PROJECT-REF') && window.supabase){try{supabase=window.supabase.createClient(window.WORKOUT_CONFIG.supabaseUrl,window.WORKOUT_CONFIG.supabaseKey);cloudReady=true}catch(e){console.warn('Supabase init failed',e)}}
function openDB(){return new Promise(res=>{try{if(!('indexedDB' in window))throw new Error('IndexedDB unavailable');const q=indexedDB.open('workout-tracker-db',1);q.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('sessions')){const s=d.createObjectStore('sessions',{keyPath:'id'});s.createIndex('date','date');s.createIndex('routine','routine')}};q.onsuccess=e=>{db=e.target.result;storageFallback=false;res(db)};q.onerror=()=>{storageFallback=true;res(null)}}catch(e){storageFallback=true;res(null)}})}
function tx(mode='readonly'){return db.transaction('sessions',mode).objectStore('sessions')}
function getFallbackSessions(){try{return JSON.parse(localStorage.getItem(LOCAL_SESSIONS_KEY)||'[]')}catch(e){return []}}
function setFallbackSessions(rows){localStorage.setItem(LOCAL_SESSIONS_KEY,JSON.stringify(rows))}
async function getLocalSessions(){if(storageFallback||!db)return getFallbackSessions().sort((a,b)=>new Date(a.date)-new Date(b.date));return new Promise(res=>{const q=tx().getAll();q.onsuccess=()=>res(q.result.sort((a,b)=>new Date(a.date)-new Date(b.date)));q.onerror=()=>{storageFallback=true;res(getFallbackSessions())}})}
async function getSessions(){return getLocalSessions()}
async function putLocalSession(s){if(storageFallback||!db){const rows=getFallbackSessions();const idx=rows.findIndex(x=>x.id===s.id);if(idx>=0)rows[idx]=s;else rows.push(s);setFallbackSessions(rows);return}return new Promise(res=>{const q=tx('readwrite').put(s);q.onsuccess=()=>res();q.onerror=()=>{storageFallback=true;const rows=getFallbackSessions();const idx=rows.findIndex(x=>x.id===s.id);if(idx>=0)rows[idx]=s;else rows.push(s);setFallbackSessions(rows);res()}})}
async function putSession(s){await putLocalSession(s);if(cloudReady&&currentUser&&!cloudSyncing){const {error}=await supabase.from('workout_sessions').upsert({id:s.id,user_id:currentUser.id,session_date:s.date,routine:s.routine,payload:s,updated_at:new Date().toISOString()});if(error)console.warn('Cloud session sync failed',error)}}
async function loadCloudState(){if(!cloudReady||!currentUser)return;cloudSyncing=true;try{const [{data:remoteSessions,error:sesErr},{data:remoteProgram,error:progErr}]=await Promise.all([supabase.from('workout_sessions').select('id,session_date,routine,payload,updated_at').order('session_date',{ascending:true}),supabase.from('workout_programs').select('program,updated_at').maybeSingle()]);if(sesErr)throw sesErr;if(progErr)throw progErr;const local=await getLocalSessions();const map=new Map(local.map(x=>[x.id,x]));for(const x of remoteSessions||[]){const r=x.payload||{id:x.id,date:x.session_date,routine:x.routine};if(!map.has(r.id))map.set(r.id,r)}const merged=[...map.values()].sort((a,b)=>new Date(a.date)-new Date(b.date));if(storageFallback||!db)setFallbackSessions(merged);else for(const row of merged)await putLocalSession(row);const localProgram=(()=>{try{return JSON.parse(localStorage.getItem('wt-program')||'null')}catch(e){return null}})();if(!localProgram&&remoteProgram?.program){state.program=normalizeProgram(remoteProgram.program);localStorage.setItem('wt-program',JSON.stringify(state.program))}else{await supabase.from('workout_programs').upsert({user_id:currentUser.id,program:state.program,updated_at:new Date().toISOString()})}for(const row of merged)await supabase.from('workout_sessions').upsert({id:row.id,user_id:currentUser.id,session_date:row.date,routine:row.routine,payload:row,updated_at:new Date().toISOString()})}catch(e){console.warn('Cloud load/sync failed',e);notify('Cloud sync failed. Your local data is still safe.','warn')}finally{cloudSyncing=false;updateAuthUI();await renderAll()}}
async function syncProgramToCloud(){localStorage.setItem('wt-program',JSON.stringify(state.program));if(!cloudReady||!currentUser)return;const {error}=await supabase.from('workout_programs').upsert({user_id:currentUser.id,program:state.program,updated_at:new Date().toISOString()});if(error){console.warn('Program sync failed',error);notify('Program saved locally, but cloud sync failed.','warn')}}
function notify(msg,type='ok'){const n=document.createElement('div');n.className=`statusbar ${type}`;n.textContent=msg;document.querySelector('.container').prepend(n);setTimeout(()=>n.remove(),3500)}
async function openAuth(){if(!cloudReady){alert('Cloud sync is not configured yet. Add your Supabase URL and publishable key to config.js.');return}const m=el('authModal');m.classList.remove('hidden');m.innerHTML=`<div class="modal-card"><div class="row between"><div><div class="h2">Cloud Sync</div><div class="muted">Sign in to sync your workouts across devices.</div></div><button class="iconbtn" id="closeAuth">✕</button></div><div class="auth-grid" style="margin-top:14px"><input class="input" id="authEmail" type="email" placeholder="Email"><input class="input" id="authPassword" type="password" placeholder="Password"><div class="row"><button class="btn primary" id="signInBtn">Sign in</button><button class="btn" id="signUpBtn">Create account</button></div><div class="tiny muted">Your workout data is protected by Supabase Row Level Security.</div></div></div>`;el('closeAuth').onclick=()=>m.classList.add('hidden');el('signInBtn').onclick=async()=>{const email=el('authEmail').value.trim(),password=el('authPassword').value;if(!email||!password)return alert('Enter an email and password.');const {error}=await supabase.auth.signInWithPassword({email,password});if(error)return alert(error.message);m.classList.add('hidden')};el('signUpBtn').onclick=async()=>{const email=el('authEmail').value.trim(),password=el('authPassword').value;if(!email||!password)return alert('Enter an email and password.');if(password.length<6)return alert('Use at least 6 characters for the password.');const {error}=await supabase.auth.signUp({email,password});if(error)return alert(error.message);alert('Account created. Check your email if confirmation is required, then sign in.')}}
async function signOut(){if(cloudReady){await supabase.auth.signOut();currentUser=null;updateAuthUI();await renderAll()}}
function updateAuthUI(){const b=el('settingsBtn');if(!b)return;b.title=currentUser?`Signed in as ${currentUser.email}`:'Cloud Sync';b.textContent=currentUser?'☁️':'⚙️'}
async function initCloud(){if(!cloudReady)return;const {data}=await supabase.auth.getSession();currentUser=data?.session?.user||null;updateAuthUI();supabase.auth.onAuthStateChange(async(_event,session)=>{currentUser=session?.user||null;updateAuthUI();if(currentUser)await loadCloudState();else await renderAll()});if(currentUser)await loadCloudState()}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function el(id){return document.getElementById(id)}
function saveDraft(){localStorage.setItem('wt-draft',JSON.stringify(state.draft))}
function getDraft(exId){return state.draft[exId]||{sets:[]}}
function today(){return new Date().toISOString().slice(0,10)}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function currentRoutine(){return state.program.find(r=>r.key===state.routine)||state.program[0]}
function calcE1RM(w,r){return w&&r?Math.round(w*(1+r/30)*10)/10:0}
function parseRepMax(reps){const nums=(String(reps||'').match(/\d+/g)||[]).map(Number);return nums.length?Math.max(...nums):null}
function suggestedWeights(ex,history){const n=stepCount(ex);let base=(ex.targetWeights||[]).slice(0,n);while(base.length<n)base.push(base.length?base[base.length-1]:null);const rows=history.filter(s=>s.routine===state.routine).flatMap(s=>s.exercises.filter(x=>x.name===ex.name).flatMap(x=>x.sets||[])).filter(x=>x.weight!=null&&x.reps!=null);if(!rows.length)return base;const last=rows.slice(-Math.max(n,5));const top=Math.max(...last.map(x=>Number(x.weight)||0));const repMax=parseRepMax(ex.reps);const allHit=repMax&&last.length>=n&&last.slice(-n).every(x=>Number(x.reps)>=repMax);if(ex.progression==='none')return base.length?base:Array(n).fill(top);if(ex.progression==='all'&&ex.inc&&allHit)return base.map((w,i)=>(Number(w)||top)+Number(ex.inc));if(ex.progression==='last'&&ex.inc&&allHit){const start=base.length?base:Array(n).fill(top);return start.map((w,i)=>i===start.length-1?(Number(w)||top)+Number(ex.inc):(Number(w)||top))}return base.map(w=>Number(w)||top||'')}
async function renderWorkout(){const r=currentRoutine();if(!r)return;const sessions=await getSessions();el('headerSub').textContent=`${r.name} • ${new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}`;let h=`<div class="row between"><div><div class="h1">${esc(r.name)}</div><div class="muted">Today’s session</div></div><div class="pill">${r.exercises.filter(e=>e.active).length} exercises</div></div>`;h+=`<div class="grid2 card"><label class="tiny muted">Session date<input id="sessionDate" class="input" type="date" value="${state.draft._date||today()}"></label><label class="tiny muted">Notes<textarea id="sessionNotes" class="input" rows="1" placeholder="Optional">${esc(state.draft._notes||'')}</textarea></label></div>`;h+=`<div class="tabs">${state.program.map(x=>`<button class="tab ${x.key===state.routine?'active':''}" data-routine="${x.key}">${esc(x.name)}</button>`).join('')}</div>`;
for(const ex of r.exercises.filter(e=>e.active)){const d=getDraft(ex.id);const targets=suggestedWeights(ex,sessions);const count=Math.max(stepCount(ex),d.sets?.length||0);h+=`<div class="card exercise"><div class="exercise-head"><div class="exercise-title">${esc(ex.name)}<div class="tiny muted">${esc(ex.sets||'')} ${ex.reps?'• '+esc(ex.reps):''} ${ex.target?'• '+esc(ex.target):''}</div></div><div class="pill">${ex.progression==='none'?'No auto progression':`+${ex.inc||0} after hit`}</div></div><div class="sets">`;
for(let i=0;i<count;i++){const s=d.sets?.[i]||{};const tw=targets[i]??'';h+=`<div class="setrow"><div class="setnum">${i+1}</div><input class="input set-wt" data-ex="${ex.id}" data-i="${i}" value="${s.weight??''}" inputmode="decimal" placeholder="${tw!==''?'target '+tw:'wt'}"><input class="input set-rep" data-ex="${ex.id}" data-i="${i}" value="${s.reps??''}" inputmode="numeric" placeholder="reps"><div class="setstatus">${tw!==''?`Target ${esc(tw)}<br>`:''}${s.weight&&s.reps?calcE1RM(Number(s.weight),Number(s.reps))+' e1RM':''}</div></div>`}h+=`</div></div>`}
h+=`<div class="sticky-actions"><button class="logbig" id="logWorkout">LOG WORKOUT</button></div>`;el('workoutView').innerHTML=h;bindWorkout()}
function bindWorkout(){document.querySelectorAll('[data-routine]').forEach(b=>b.onclick=()=>{state.routine=b.dataset.routine;localStorage.setItem('wt-routine',state.routine);renderAll()});el('sessionDate').oninput=e=>{state.draft._date=e.target.value;saveDraft()};el('sessionNotes').oninput=e=>{state.draft._notes=e.target.value;saveDraft()};document.querySelectorAll('.set-wt,.set-rep').forEach(inp=>inp.oninput=e=>{const d=getDraft(inp.dataset.ex);d.sets=d.sets||[];d.sets[inp.dataset.i]=d.sets[inp.dataset.i]||{};if(inp.classList.contains('set-wt'))d.sets[inp.dataset.i].weight=inp.value===''?null:Number(inp.value);else d.sets[inp.dataset.i].reps=inp.value===''?null:Number(inp.value);state.draft[inp.dataset.ex]=d;saveDraft()});el('logWorkout').onclick=logCurrent}
async function logCurrent(){const r=currentRoutine();const date=state.draft._date||today();const exercises=[];for(const ex of r.exercises.filter(e=>e.active)){const d=getDraft(ex.id);const sets=(d.sets||[]).filter(s=>s.weight!=null||s.reps!=null);if(sets.length)exercises.push({name:ex.name,sets:sets.map(s=>({weight:s.weight,reps:s.reps,e1rm:calcE1RM(s.weight,s.reps)})),target:ex.reps,programSets:ex.sets,recWeight:ex.targetWeights||[]})}if(!exercises.length){alert('Enter at least one set before logging.');return}await putSession({id:uid(),date,timestamp:new Date().toISOString(),routine:r.key,notes:state.draft._notes||'',exercises});state.draft={};saveDraft();await renderAll();notify('Workout logged. Nice work.','ok')}
async function renderDashboard(){const ss=await getSessions();const allSets=ss.flatMap(s=>s.exercises.flatMap(e=>e.sets.map(x=>({...x,name:e.name,routine:s.routine,date:s.date}))));const totalVol=Math.round(allSets.reduce((a,x)=>a+(x.weight||0)*(x.reps||0),0));const last=ss[ss.length-1];const prs={};for(const x of allSets)prs[x.name]=Math.max(prs[x.name]||0,x.e1rm||0);const top=Object.entries(prs).sort((a,b)=>b[1]-a[1]).slice(0,5);let h=`<div class="h1">Progress</div><div class="muted">Your history builds automatically as you log sessions.</div><div class="kpis" style="margin-top:12px"><div class="kpi"><div class="v">${ss.length}</div><div class="l">Workouts logged</div></div><div class="kpi"><div class="v">${Math.round(totalVol).toLocaleString()}</div><div class="l">Total volume</div></div><div class="kpi"><div class="v">${last?new Date(last.date).toLocaleDateString(undefined,{month:'short',day:'numeric'}):'—'}</div><div class="l">Last workout</div></div><div class="kpi"><div class="v">${allSets.length}</div><div class="l">Sets logged</div></div></div>`;const focus=['A1 Barbell Squat','A1 DB/BB Bench Press','A1 Deadlift','A1 DB Shoulder Press (neutral)'];h+=`<div class="section-title">Key lifts</div>`;for(const ex of focus){const pts=allSets.filter(x=>x.name===ex).sort((a,b)=>new Date(a.date)-new Date(b.date));h+=`<div class="card"><div class="row between"><b>${esc(ex)}</b><span class="pill">Best e1RM ${pts.length?Math.max(...pts.map(p=>p.e1rm||0)).toFixed(1):'—'}</span></div><div class="chart">${lineChart(pts.slice(-20))}</div></div>`}h+=`<div class="section-title">Top estimated 1RM</div><div class="card list">${top.map(x=>`<div class="listrow"><div>${esc(x[0])}</div><div class="value">${x[1].toFixed(1)}</div></div>`).join('')||'<div class="muted">Log a workout to see progress.</div>'}</div>`;el('dashboardView').innerHTML=h}
function lineChart(pts){if(!pts.length)return '<div class="muted" style="padding:16px">No data yet.</div>';const w=620,h=190,p=28,vals=pts.map(x=>x.e1rm||0),min=Math.min(...vals),max=Math.max(...vals),span=max-min||1;const path=pts.map((x,i)=>{const px=p+i*(w-2*p)/Math.max(pts.length-1,1);const py=h-p-(x.e1rm-min)/span*(h-2*p);return(i?'L':'M')+px.toFixed(1)+','+py.toFixed(1)}).join(' ');const dots=pts.map((x,i)=>{const px=p+i*(w-2*p)/Math.max(pts.length-1,1);const py=h-p-(x.e1rm-min)/span*(h-2*p);return`<circle cx="${px}" cy="${py}" r="4" fill="#2563eb"/>`}).join('');return`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" stroke="#d1d5db"/><path d="${path}" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${dots}<text x="${p}" y="18" font-size="12" fill="#6b7280">${max.toFixed(0)}</text><text x="${p}" y="${h-4}" font-size="12" fill="#6b7280">${min.toFixed(0)}</text></svg>`}
async function renderHistory(){const ss=(await getSessions()).slice().reverse();let h='<div class="h1">History</div><div class="muted">Tap a session to inspect what you actually did.</div><div class="list" style="margin-top:12px">';for(const s of ss){const sets=s.exercises.reduce((a,e)=>a+e.sets.length,0);h+=`<button class="card" data-session="${s.id}" style="text-align:left;width:100%"><div class="row between"><b>${esc(s.routine)}</b><span class="pill">${sets} sets</span></div><div class="tiny muted">${new Date(s.date).toLocaleDateString()} ${s.notes?'• '+esc(s.notes):''}</div></button>`}h+=ss.length?'':'<div class="card muted">No workouts logged yet.</div>';h+='</div>';el('historyView').innerHTML=h;document.querySelectorAll('[data-session]').forEach(b=>b.onclick=async()=>{const s=(await getSessions()).find(x=>x.id===b.dataset.session);alert(s.exercises.map(e=>e.name+'\n'+e.sets.map((x,i)=>`Set ${i+1}: ${x.weight??'—'} × ${x.reps??'—'}`).join('\n')).join('\n\n'))})}
function programRow(r,ex,index){const targets=(ex.targetWeights||[]).join(', ');return`<div class="program-card" data-pcard="${r.key}|${ex.id}"><div class="row between"><div class="row"><input type="checkbox" data-pactive="${r.key}|${ex.id}" ${ex.active?'checked':''}><b>${index+1}. ${esc(ex.name||'New exercise')}</b></div><div class="row"><button class="btn small" data-moveup="${r.key}|${ex.id}">↑</button><button class="btn small" data-movedown="${r.key}|${ex.id}">↓</button><button class="btn small danger-outline" data-remove="${r.key}|${ex.id}">Remove</button></div></div><div class="grid2" style="margin-top:10px"><label class="tiny muted">Exercise<input class="input" data-pname="${r.key}|${ex.id}" value="${esc(ex.name)}"></label><label class="tiny muted">Sets<input class="input" data-psets="${r.key}|${ex.id}" value="${esc(ex.sets||'')}" placeholder="3"></label><label class="tiny muted">Rep target<input class="input" data-preps="${r.key}|${ex.id}" value="${esc(ex.reps||'')}" placeholder="8-10"></label><label class="tiny muted">Target weight / set<input class="input" data-ptargets="${r.key}|${ex.id}" value="${esc(targets)}" placeholder="225, 235, 245"></label><label class="tiny muted">Progression<input class="input" data-pinc="${r.key}|${ex.id}" value="${esc(ex.inc||'')}" inputmode="decimal" placeholder="+5"></label><label class="tiny muted">Rule<select class="input" data-prule="${r.key}|${ex.id}"><option value="last" ${ex.progression==='last'?'selected':''}>Add to last set</option><option value="all" ${ex.progression==='all'?'selected':''}>Add to every set</option><option value="none" ${ex.progression==='none'?'selected':''}>No automatic increase</option></select></label></div><label class="tiny muted" style="display:block;margin-top:8px">Notes / cue<input class="input" data-ptarget="${r.key}|${ex.id}" value="${esc(ex.target||'')}" placeholder="Tempo, load cue, equipment, etc."></label></div>`}
function renderProgram(){let h='<div class="h1">Program</div><div class="muted">This is now the master program. Changes here control future workouts and what gets logged.</div><div class="note" style="margin-top:10px">Target weight / set: enter comma-separated weights, e.g. <b>225, 235, 245</b>. Progression applies after you hit the rep target.</div>';for(const r of state.program){h+=`<div class="section-title row between"><span>${esc(r.name)}</span><button class="btn small" data-addex="${r.key}">+ Exercise</button></div><div class="card">${r.exercises.length?r.exercises.map((ex,i)=>programRow(r,ex,i)).join(''):'<div class="muted">No exercises yet.</div>'}</div>`}h+=`<div class="row" style="margin:10px 0 18px"><button class="btn primary" id="saveProgram">Save Program</button><button class="btn" id="addRoutine">+ Routine</button></div><div class="section-title">Data</div><div class="card grid2"><button class="btn" id="exportData">Export Backup</button><label class="btn" style="text-align:center">Import Backup<input id="importData" type="file" accept="application/json" hidden></label></div><div class="note">Backups include your program and workout history. Cloud sync runs automatically when signed in.</div>`;el('programView').innerHTML=h;bindProgram()}
function findExercise(rKey,id){const r=state.program.find(x=>x.key===rKey);return {r,ex:r?.exercises.find(x=>x.id===id)}}
function bindProgram(){document.querySelectorAll('[data-addex]').forEach(b=>b.onclick=()=>{const r=state.program.find(x=>x.key===b.dataset.addex);r.exercises.push({id:`${r.key}-${uid().slice(0,8)}`,name:'New exercise',sets:'3',reps:'8-10',target:'',inc:0,active:true,targetWeights:[],progression:'last'});renderProgram()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const [rk,id]=b.dataset.remove.split('|');const {r,ex}=findExercise(rk,id);if(!r||!ex)return;if(!confirm(`Remove ${ex.name} from ${r.name}?`))return;r.exercises=r.exercises.filter(x=>x.id!==id);renderProgram()});document.querySelectorAll('[data-moveup]').forEach(b=>b.onclick=()=>moveExercise(b.dataset.moveup,-1));document.querySelectorAll('[data-movedown]').forEach(b=>b.onclick=()=>moveExercise(b.dataset.movedown,1));el('addRoutine').onclick=()=>{const name=prompt('Routine name');if(!name)return;const key=`routine-${Date.now()}`;state.program.push({key,name:name.trim(),exercises:[]});state.routine=key;renderProgram()};el('saveProgram').onclick=async()=>{for(const r of state.program){r.exercises.forEach(ex=>{const key=`${r.key}|${ex.id}`;ex.active=document.querySelector(`[data-pactive="${key}"]`)?.checked??ex.active;ex.name=document.querySelector(`[data-pname="${key}"]`)?.value.trim()||'Unnamed exercise';ex.sets=document.querySelector(`[data-psets="${key}"]`)?.value.trim()||'';ex.reps=document.querySelector(`[data-preps="${key}"]`)?.value.trim()||'';ex.targetWeights=parseWeights(document.querySelector(`[data-ptargets="${key}"]`)?.value||'');ex.inc=Number(document.querySelector(`[data-pinc="${key}"]`)?.value)||0;ex.progression=document.querySelector(`[data-prule="${key}"]`)?.value||'last';ex.target=document.querySelector(`[data-ptarget="${key}"]`)?.value.trim()||''})}await syncProgramToCloud();state.draft={};saveDraft();await renderAll();notify('Program saved. Future workouts use the new settings.','ok')};el('exportData').onclick=async()=>{const payload={version:2,exportedAt:new Date().toISOString(),program:state.program,sessions:await getSessions()};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download=`workout-backup-${today()}.json`;a.click()};el('importData').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const data=JSON.parse(await f.text());if(data.program)state.program=normalizeProgram(data.program);if(Array.isArray(data.sessions))for(const s of data.sessions)await putSession(s);await syncProgramToCloud();await renderAll();notify('Backup imported.','ok')}catch(err){alert('Could not import that backup file.')}}}
function moveExercise(ref,delta){const [rk,id]=ref.split('|');const r=state.program.find(x=>x.key===rk);if(!r)return;const i=r.exercises.findIndex(x=>x.id===id),j=i+delta;if(i<0||j<0||j>=r.exercises.length)return;[r.exercises[i],r.exercises[j]]=[r.exercises[j],r.exercises[i]];renderProgram()}
function nav(view){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===`view-${view}`));document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='workout')renderWorkout();if(view==='dashboard')renderDashboard();if(view==='history')renderHistory();if(view==='program')renderProgram()}
async function renderAll(){await renderWorkout();await renderDashboard();await renderHistory();renderProgram()}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>nav(b.dataset.view));
el('settingsBtn').onclick=()=>{if(currentUser){if(confirm(`Signed in as ${currentUser.email}. Sign out?`))signOut()}else openAuth()};
async function bootApp(){
  try{
    await openDB();
    await renderAll();
    document.getElementById('bootError').style.display='none';
  }catch(err){
    console.error('Workout Tracker boot error',err);
    const b=document.getElementById('bootError');
    b.textContent='Workout Tracker could not start: '+(err?.message||String(err));
    b.style.display='block';
  }
  try{
    if(window.WORKOUT_CONFIG && window.WORKOUT_CONFIG.supabaseUrl && !window.WORKOUT_CONFIG.supabaseUrl.includes('YOUR-PROJECT-REF')){
      await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)});
      if(window.supabase){
        try{supabase=window.supabase.createClient(window.WORKOUT_CONFIG.supabaseUrl,window.WORKOUT_CONFIG.supabaseKey);cloudReady=true;await initCloud()}catch(e){console.warn('Supabase init failed',e)}
      }
    }
  }catch(e){console.warn('Optional cloud initialization failed',e)}
}
bootApp();
