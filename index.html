async function cloudForceSaveLibrary(){if(!cloudConfig||!currentUser)return {status:'no-cloud'};const program=normalizeProgramLibrary(state.library);if(!program||!program.programs?.length)throw new Error('Cannot save an empty program library.');const ts=new Date().toISOString();const body={user_id:currentUser.id,program:program,updated_at:ts};const rows=await api('workout_programs?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify(body)});const savedTs=Array.isArray(rows)&&rows[0]?.updated_at?rows[0].updated_at:ts;state.library=program;await saveLibraryLocal(savedTs);await setProgramMeta({baseTs:savedTs,cloudTs:savedTs,dirty:false});return {status:'saved',ts:savedTs}}
async function cloudSaveLibrary({force=false}={}){if(!cloudConfig||!currentUser)return {status:'local'};const remote=await cloudGetLibraryRow();const remoteTs=remote?.updated_at||'';const expected=programMeta.baseTs||programMeta.cloudTs||'';if(!force&&remote&&expected&&remoteTs&&remoteTs!==expected){return {status:'conflict',remote,remoteTs}}if(!force&&remote&&!expected){return {status:'conflict',remote,remoteTs}}const ts=new Date().toISOString();if(remote){const qs=`workout_programs?user_id=eq.${encodeURIComponent(currentUser.id)}&updated_at=eq.${encodeURIComponent(expected||remoteTs)}`;const rows=await api(qs,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({program:state.library,updated_at:ts})});if(!Array.isArray(rows)||rows.length===0){const latest=await cloudGetLibraryRow();return {status:'conflict',remote:latest,remoteTs:latest?.updated_at||''}}const savedTs=rows[0]?.updated_at||ts;await saveLibraryLocal(savedTs);await setProgramMeta({baseTs:savedTs,cloudTs:savedTs,dirty:false});return {status:'saved',ts:savedTs}}else{const rows=await api('workout_programs',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({user_id:currentUser.id,program:state.library,updated_at:ts})});const savedTs=Array.isArray(rows)&&rows[0]?.updated_at?rows[0].updated_at:ts;await saveLibraryLocal(savedTs);await setProgramMeta({baseTs:savedTs,cloudTs:savedTs,dirty:false});return {status:'saved',ts:savedTs}}}

async function boot(){
  try{
    await openDB();
    await loadLibraryLocal();
    cloudConfig=await getCloudConfig();
    if(cloudConfig){
      cloudReady=true;
      cloudSession=await getCloudSession();
      if(cloudSession){
        await refreshSession();
        currentUser=cloudSession?.user||currentUser;
      }
    }
    if(currentUser){
      // Authenticated startup: cloud is authoritative. Do not render cached/local program first.
      const r=await cloudLoadLibrary();
      await loadCloudSessions();
      if(r.status==='conflict'&&r.remote){ await openProgramConflict(r.remote,r.remoteTs); }
    }
    state.routineId=lsGet(localKey('routineId'),activeRoutines()[0]?.id);
    if(!activeRoutines().some(r=>r.id===state.routineId))state.routineId=activeRoutines()[0]?.id;
    await renderAll();
    appReady=true;
    el('bootError').style.display='none';
    updateSettingsButton();
  }catch(e){
    console.error('boot',e);
    // If cloud initialization fails, fall back to the already-loaded local cache.
    try{
      if(!state.library) await loadLibraryLocal();
      state.routineId=lsGet(localKey('routineId'),activeRoutines()[0]?.id);
      if(!activeRoutines().some(r=>r.id===state.routineId))state.routineId=activeRoutines()[0]?.id;
      await renderAll();
      appReady=true;
    }catch(_){ }
    el('bootError').textContent='Workout Tracker could not start: '+e.message;
    el('bootError').style.display='block';
    updateSettingsButton();
  }
}

function progressionStatus(ex,sessions){if(ex.progression==='531'||ex.progression==='manual')return {label:'Manual',qualified:false};const hist=exerciseHistory(ex,sessions);const last=hist.at(-1);if(!last)return {label:'New',qualified:false};const metric=ex.metric||'reps';const range=parseMetricRange(ex.reps,metric);const sets=(last.exercise?.sets||[]).filter(s=>!s.warmup);if(!sets.length)return {label:'No sets',qualified:false};const vals=sets.map(s=>parseMetricValue(s.reps,metric));const minOk=vals.every(v=>v>=range.min);const qualified=range.max>0&&vals.length>=Math.max(1,Number(String(ex.sets).match(/\d+/)?.[0]||1))&&vals.every(v=>v>=range.max);if(qualified)return {label:metric==='time'?'Time goal hit':'Progress earned',qualified:true};if(vals.some(v=>v<range.min))return {label:metric==='time'?'Below duration':'Below range',qualified:false,review:hist.slice(-2).every(h=>{const ss=h.exercise?.sets||[];return ss.length&&ss.some(s=>parseMetricValue(s.reps,metric)<range.min)})};return {label:metric==='time'?'Build duration':'Build reps',qualified:false}}
function recommendedAccessory(ex,sessions){const st=progressionStatus(ex,sessions);const inc=Number(ex.inc)||0;if(st.qualified&&(ex.metric||'reps')==='time'&&(ex.progression==='bodyweight'||ex.progression==='double')&&inc>0){const next=incrementTimeRange(ex.reps,inc);return {kind:'time',from:ex.reps,to:next,label:`${ex.reps} → ${next}`}}const cur=ex.targetWeights?.length?ex.targetWeights.slice():[];const n=Math.max(stepCount(ex),cur.length||0);while(cur.length<n)cur.push(cur.length?cur[cur.length-1]:null);if(ex.progression==='double'&&st.qualified&&inc>0){const base=cur.some(v=>Number(v)>0)?cur:cur.map((_,i)=>Number(ex.targetWeights?.[i]||0));const next=ex.progressionRule==='last'?base.map((w,i)=>i===base.length-1?(Number(w)||0)+inc:Number(w)||0):base.map(w=>(Number(w)||0)+inc);return {kind:'weights',from:base,to:next,label:`${base.map(x=>x||'—').join(' / ')} → ${next.map(x=>x||'—').join(' / ')}`}}if(ex.loadType==='bodyweight'&&ex.progression==='bodyweight'&&st.qualified){const next=incrementRepRange(ex.reps,1);return {kind:'reps',from:ex.reps,to:next,label:`${ex.reps} → ${next} reps`}}return null}
function incrementTimeRange(s,inc){const parts=String(s||'').trim().split(/\s*[-–]\s*/);const d=Math.max(1,Number(inc)||5);if(parts.length>=2)return `${formatDuration(parseDuration(parts[0])+d)}-${formatDuration(parseDuration(parts[1])+d)}`;return formatDuration(parseDuration(s)+d)}
function incrementTimeRange(s,inc){const parts=String(s||'').trim().split(/\s*[-–]\s*/);const d=Math.max(1,Number(inc)||5);if(parts.length>=2)return `${formatDuration(parseDuration(parts[0])+d)}-${formatDuration(parseDuration(parts[1])+d)}`;return formatDuration(parseDuration(s)+d)}
function five31(r){const c=r.fiveThreeOne,p=FIVE_THREE_ONE[c.week];const tm=Number(c.trainingMax)||0;return p.sets.map((s,i)=>({pct:s.pct,reps:s.reps,weight:roundTo(tm*s.pct,c.rounding),amrap:false})).concat(c.week===4?[]:[{pct:p.sets[2].pct,reps:null,weight:roundTo(tm*p.sets[2].pct,c.rounding),amrap:true}])}

function renderWorkout(){if(!state.currentSessionStart)state.currentSessionStart=Date.now();const p=activeProgram(),r=currentRoutine();if(!p||!r){el('workoutView').innerHTML='<div class="card">Create a program to get started.</div>';return}const is531=r.mode==='5/3/1';const c=r.fiveThreeOne;const pres=is531?five31(r):[];el('headerSub').textContent=`${p.name} • ${r.name}`;let h=`<div class="row between"><div><div class="h1">${esc(r.name)}</div><div class="muted">${is531?`5/3/1 • Cycle ${c.cycle}, Week ${c.week}`:'Today\'s session'}</div></div><span class="pill ${is531?'blue':''}">${r.exercises.filter(e=>e.active).length} exercises</span></div>`;

if(main){h+=renderWorkoutExercise(main,true,pres)}

function renderWorkoutExercise(ex,isMain,pres=[]){const d=getDraft(ex.id);const n=isMain?pres.length:Math.max(stepCount(ex)+Number(ex.warmupSets||0),d.sets?.length||0);const metric=ex.metric||'reps';let h=`<div class="exercise-card ${ex.loadType!=='weight'?'bw':''}"><div class="exercise-head"><div><div class="row"><div class="exercise-name">${esc(ex.name)}</div>${isMain?'<span class="pill blue">Main Lift</span>':''}${!isMain&&metric==='time'?'<span class="pill purple">Time</span>':''}</div><div class="tiny muted">${isMain?'5/3/1 • 3 prescribed sets + AMRAP':`${esc(ex.sets||'')} × ${esc(ex.reps||'')} • ${esc(loadLabel(ex))} • ${metricLabel(ex)}`}</div></div>${ex.supersetGroup&&!isMain?`<span class="pill purple">↔ ${esc(supersetLabel(ex.supersetGroup))}</span>`:''}</div><div class="row" style="margin-top:8px"><button class="rest-btn" data-rest="${Number(ex.restSec)||90}">Rest ${Number(ex.restSec)||90}s</button></div><div class="set-grid">`;for(let i=0;i<n;i++){const st=d.sets?.[i]||{};const t=isMain?pres[i]:null;const warm=i<Number(ex.warmupSets||0);const target=t?.weight??(ex.targetWeights?.[i]??'');const repT=t?.amrap?'AMRAP':(metric==='time'?(t?.reps!=null?formatDuration(t.reps):formatDuration(parseMetricRange(ex.reps,'time').max)):(t?.reps??(parseRange(ex.reps).max||'')));const val=st.reps==null?'':(metric==='time'?formatDuration(st.reps):st.reps);h+=`<div class="set-row ${warm?'warmup':''}"><div class="set-num">${warm?'W'+(i+1):i-Number(ex.warmupSets||0)+1}</div>${ex.loadType==='bodyweight'?'<input class="input set-w" disabled placeholder="BW">':`<input class="input set-w" data-ex="${ex.id}" data-i="${i}" value="${st.weight??''}" inputmode="decimal" placeholder="${target!==''?'target '+target:(ex.loadType==='bodyweight_added'?'added lb':'weight')}">`}<input class="input set-r" data-ex="${ex.id}" data-i="${i}" value="${val}" inputmode="${metric==='time'?'text':'numeric'}" placeholder="${repT||metricUnit(ex)}"><div class="set-status">${target!==''?`Target ${target} function bindWorkout(){el('sessionDate').oninput=e=>state.draft._date=e.target.value;el('sessionBw').oninput=e=>state.draft._bw=e.target.value===''?null:Number(e.target.value);el('sessionNotes').oninput=e=>state.draft._notes=e.target.value;document.querySelectorAll('[data-routine-id]').forEach(b=>b.onclick=async()=>{state.routineId=b.dataset.routineId;lsSet(localKey('routineId'),state.routineId);state.draft={};renderWorkout()});document.querySelectorAll('.set-w,.set-r').forEach(inp=>inp.oninput=e=>{const ex=routineExerciseById(inp.dataset.ex);const key=inp.classList.contains('set-w')?'weight':'reps';const val=e.target.value===''?null:(key==='reps'&&ex?.metric==='time'?parseDuration(e.target.value):Number(e.target.value));setDraftValue(inp.dataset.ex,Number(inp.dataset.i),key,val);});document.querySelectorAll('[data-rest]').forEach(b=>b.onclick=()=>startTimer(Number(b.dataset.rest)||90));el('logWorkout').onclick=logWorkout}
function startTimer(sec){clearInterval(window.restTimer);let end=Date.now()+sec*1000;const t=el('timer');t.classList.add('show');const render=()=>{const left=Math.max(0,end-Date.now());el('timerValue').textContent=new Date(left).toISOString().slice(14,19);if(left<=0){clearInterval(window.restTimer);notify('Rest complete.','ok');t.classList.remove('show')}};render();window.restTimer=setInterval(render,250);el('timerStop').onclick=()=>{clearInterval(window.restTimer);t.classList.remove('show')}}
async function logWorkout(){const p=activeProgram(),r=currentRoutine();const date=state.draft._date||today();const bw=state.draft._bw??null;const started=state.currentSessionStart||Date.now();const exRows=[];for(const ex of r.exercises.filter(e=>e.active&&(!(r.mode==='5/3/1')||e.id!==r.fiveThreeOne?.mainLiftId))){const d=getDraft(ex.id);const count=Math.max(stepCount(ex),d.sets?.length||0);const sets=(d.sets||[]).slice(0,count).map((s,i)=>({weight:s.weight===''?null:(s.weight??null),reps:s.reps===''?null:(s.reps??null),warmup:i<Number(ex.warmupSets||0)})).filter(s=>s.weight!=null||s.reps!=null);if(!sets.some(s=>s.reps!=null))continue;exRows.push({exerciseId:ex.id,name:ex.name,loadType:ex.loadType,bwFactor:ex.bwFactor,supersetGroup:ex.supersetGroup,sets})}

if(!exRows.length){notify('Enter at least one completed set before logging.','warn');return}const session={id:uid(),date,timestamp:new Date().toISOString(),durationSec:Math.round((Date.now()-started)/1000),programId:p.id,programName:p.name,routineId:r.id,routine:r.name,notes:state.draft._notes||'',bodyweight:bw,cycle:r.mode==='5/3/1'?r.fiveThreeOne.cycle:null,week:r.mode==='5/3/1'?r.fiveThreeOne.week:null,trainingMax:r.mode==='5/3/1'?r.fiveThreeOne.trainingMax:null,exercises:exRows};await saveSession(session);const oldWeek=r.fiveThreeOne?.week;if(r.mode==='5/3/1'&&oldWeek<4){r.fiveThreeOne.week=oldWeek+1;await markProgramDirty();if(cloudReady&&currentUser){const sr=await cloudSaveLibrary();if(sr.status==='conflict'&&sr.remote)await openProgramConflict(sr.remote,sr.remoteTs)}}state.draft={};state.currentSessionStart=Date.now();await renderAll();await openPostWorkoutReview(r,session);notify('Workout saved.','ok')}
function sessionExerciseRows(sessions,ex){return sessions.flatMap(s=>(s.exercises||[]).filter(e=>e.exerciseId===ex.id||e.name===ex.name).map(e=>({session:s,exercise:e})))}
function buildRecommendations(r,sessions){const rec=[];for(const ex of r.exercises.filter(e=>e.active&&e.progression!=='manual'&&e.progression!=='531')){const rows=sessionExerciseRows(sessions,ex).sort((a,b)=>new Date(a.session.date)-new Date(b.session.date));const last=rows.at(-1);if(!last)continue;const range=parseRange(ex.reps);const work=last.exercise.sets.filter(s=>!s.warmup);const required=Math.max(1,parseInt(String(ex.sets).match(/\d+/)?.[0]||'1',10));if(work.length<required)continue;const reps=work.map(s=>Number(s.reps)||0);if(!reps.length)continue;const qualified=range.max>0&&reps.length>=required&&reps.every(v=>v>=range.max);if(ex.progression==='double'&&qualified&&Number(ex.inc)>0){const cur=(ex.targetWeights||[]).slice();const n=Math.max(required,cur.length||0);while(cur.length<n)cur.push(cur.length?cur.at(-1):Number(work.at(-1)?.weight)||0);const allSets=cur.map(v=>(Number(v)||0)+Number(ex.inc));const to=ex.progressionRule==='last'?cur.map((v,i)=>i===cur.length-1?(Number(v)||0)+Number(ex.inc):Number(v)||0):allSets;rec.push({routineId:r.id,exerciseId:ex.id,name:ex.name,type:'weight',from:cur,to,message:`Hit ${range.max} reps on every working set.`})}
if(ex.progression==='bodyweight'&&qualified){const next=incrementRepRange(ex.reps,1);if(next!==ex.reps)rec.push({routineId:r.id,exerciseId:ex.id,name:ex.name,type:'reps',from:ex.reps,to:next,message:`Hit ${range.max} reps on every set.`});else rec.push({routineId:r.id,exerciseId:ex.id,name:ex.name,type:'difficulty',from:'Current',to:'Increase difficulty/load',message:`Rep goal hit.`})}}
return rec}
function applyRecommendation(rec){const r=activeRoutines().find(x=>x.id===rec.routineId);const ex=r?.exercises.find(x=>x.id===rec.exerciseId);if(!ex)return;if(rec.type==='weight')ex.targetWeights=rec.to.map(Number);if(rec.type==='reps')ex.reps=rec.to}
async function openPostWorkoutReview(r,session){const sessions=await getSessions();const recs=buildRecommendations(r,sessions).filter(x=>x.routineId===r.id);const isCycleEnd=r.mode==='5/3/1'&&r.fiveThreeOne.week===4; if(!recs.length&&!isCycleEnd)return;let cycleRec=null;if(isCycleEnd){const tm=r.fiveThreeOne.trainingMax;const increase=r.fiveThreeOne.tmIncrease;cycleRec={from:tm,to:tm+increase,label:`${tm} → ${tm+increase}`,message:'Cycle complete. Review the recommended Training Max before starting the next cycle.'}}

function simpleChart(points,label){if(!points.length)return '<div class="muted" style="padding:14px">No data yet.</div>';const vals=points.map(p=>Number(p.value)||0);const max=Math.max(...vals),min=Math.min(...vals);const w=600,h=205,pad=26;const pts=points.map((p,i)=>{const x=pad+(points.length===1?0:i*(w-pad*2)/(points.length-1));const y=170-(max===min?70:(Number(p.value)-min)/(max-min)*120);return `${x},${y}`}).join(' ');return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg"><polyline fill="none" stroke="#2563eb" stroke-width="4" points="${pts}"/>${points.map((p,i)=>{const x=pad+(points.length===1?0:i*(w-pad*2)/(points.length-1));const y=170-(max===min?70:(Number(p.value)-min)/(max-min)*120);return `<circle cx="${x}" cy="${y}" r="4" fill="#2563eb"><title>${esc(p.label||p.date)}: ${Number(p.value).toFixed(1)}</title></circle>`}).join('')}<text x="14" y="18" font-size="11" fill="#64748b">${esc(label)}</text><text x="14" y="194" font-size="10" fill="#94a3b8">${esc(points[0].label||'Start')}</text><text x="530" y="194" font-size="10" fill="#94a3b8">${esc(points.at(-1).label||'Now')}</text></svg>`}
function aggregateExercise(sessions,name){const rows=[];for(const s of sessions){for(const e of s.exercises||[]){if(e.name!==name)continue;const metric=e.metric||'reps';let vol=0,bestWeight=0,bestValue=0,bestE1=0,amrap=0,timeSeconds=0;for(const st of e.sets||[]){if(st.warmup)continue;const eff=effectiveWeight(st,e,s.bodyweight);const value=parseMetricValue(st.reps,metric);const wt=Number(st.weight)||0;vol+=eff*value;if(metric==='time')timeSeconds+=value;else{bestE1=Math.max(bestE1,calcE1RM(eff,value));if(st.amrap)amrap=Math.max(amrap,value)}bestWeight=Math.max(bestWeight,wt);bestValue=Math.max(bestValue,value)}rows.push({date:s.date,volume:vol,weight:bestWeight,reps:metric==='time'?0:bestValue,time:metric==='time'?bestValue:0,e1rm:bestE1,amrap,runtime:metric,effective:bestWeight||((e.loadType!=='weight')?Math.max(...(e.sets||[]).map(st=>effectiveWeight(st,e,s.bodyweight))):0),routine:s.routine,timeSeconds})}}return rows.sort((a,b)=>new Date(a.date)-new Date(b.date))}

async function renderDashboard(){const sessions=await getSessions();const allNames=[...new Set(sessions.flatMap(s=>(s.exercises||[]).map(e=>e.name)))];const focus=activeRoutines().map(r=>r.mode==='5/3/1'?mainLift(r)?.name:r.exercises.find(e=>e.active)?.name).filter(Boolean);const defaultEx=focus.find(x=>allNames.includes(x))||allNames[0]||'';const prs={};for(const name of allNames){const rows=aggregateExercise(sessions,name);prs[name]=Math.max(0,...rows.map(x=>x.e1rm))}const volume=sessions.reduce((a,s)=>a+sessionSummary(s).repVolume,0);const timedSeconds=sessions.reduce((a,s)=>a+sessionSummary(s).timeSeconds,0);let h=`<div class="h1">Progress</div><div class="muted">Strength, volume, 5/3/1 cycles, PRs and bodyweight trends.</div><div class="kpis" style="margin-top:12px"><div class="kpi"><div class="v">${sessions.length}</div><div class="l">Workouts</div></div><div class="kpi"><div class="v">${Math.round(volume).toLocaleString()}</div><div class="l">Rep volume (lb-reps)</div></div><div class="kpi"><div class="v">${timedSeconds?formatDuration(timedSeconds):'—'}</div><div class="l">Timed work</div></div><div class="kpi"><div class="v">${Object.keys(prs).length}</div><div class="l">Exercises</div></div><div class="kpi"><div class="v">${sessions.at(-1)?new Date(sessions.at(-1).date).toLocaleDateString(undefined,{month:'short',day:'numeric'}):'—'}</div><div class="l">Last workout</div></div></div>`;
h+=`<div class="section-title">Exercise progress</div><div class="card"><div class="grid3"><label class="label">Exercise<select class="input" id="dashEx">${allNames.map(n=>`<option ${n===defaultEx?'selected':''}>${esc(n)}</option>`).join('')}</select></label><label class="label">Metric<select class="input" id="dashMetric"><option value="e1rm">Estimated 1RM</option><option value="weight">Top load</option><option value="volume">Session volume</option><option value="reps">Best reps</option><option value="time">Best hold time</option><option value="amrap">AMRAP reps</option><option value="effective">Effective load</option></select></label><label class="label">Range<select class="input" id="dashRange"><option value="all">All time</option><option value="365">12 months</option><option value="180">6 months</option><option value="90">90 days</option></select></label></div><div id="dashChart" class="chart" style="margin-top:10px"></div></div>`;
for(const r of activeRoutines().filter(x=>x.mode==='5/3/1')){const name=mainLift(r)?.name||r.name;const rows=sessions.filter(s=>s.routineId===r.id).sort((a,b)=>new Date(a.date)-new Date(b.date));const tmBy=[];const amrapBy=[];rows.forEach(s=>{if(!tmBy.some(x=>x.cycle===s.cycle))tmBy.push({cycle:s.cycle,value:s.trainingMax||r.fiveThreeOne.trainingMax,label:`C${s.cycle}`});const main=s.exercises.find(e=>e.is531Main||e.name===name);const a=main?.sets?.find(x=>x.amrap);if(a?.reps)amrapBy.push({cycle:s.cycle,week:s.week,value:Number(a.reps),label:`C${s.cycle} W${s.week}`})});h+=`<div class="section-title">${esc(name)} — 5/3/1 Cycle History</div><div class="card"><div class="grid2"><div><div class="tiny muted">Training Max</div><div class="chart">${simpleChart(tmBy.map(x=>({value:x.value,label:x.label})),'Training Max')}</div></div><div><div class="tiny muted">AMRAP reps</div><div class="chart">${simpleChart(amrapBy,'AMRAP reps')}</div></div></div><div style="overflow:auto;margin-top:10px"><table class="table"><thead><tr><th>Cycle</th><th>W1</th><th>W2</th><th>W3</th><th>W4</th></tr></thead><tbody>${[...new Set(amrapBy.map(x=>x.cycle))].sort((a,b)=>a-b).map(c=>`<tr><td>C${c}</td>${[1,2,3,4].map(w=>`<td>${amrapBy.find(x=>x.cycle===c&&x.week===w)?.value??'—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`}
const bw=sessions.filter(s=>s.bodyweight).map(s=>({value:Number(s.bodyweight),label:new Date(s.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})}));h+=`<div class="section-title">Bodyweight</div><div class="card"><div class="row between"><div><b>${bw.at(-1)?.value||'—'} ${bw.length?'lb':''}</b><div class="tiny muted">Logged with workouts.</div></div><span class="pill">${bw.length} readings</span></div><div class="chart" style="margin-top:10px">${simpleChart(bw,'Bodyweight')}</div></div>`;
h+=`<div class="section-title">PRs</div><div class="card list">${Object.entries(prs).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([n,v])=>`<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><div>${esc(n)}</div><b>${v?v.toFixed(1):'—'} e1RM</b></div>`).join('')||'<div class="muted">Log workouts to build PR history.</div>'}</div>`;el('dashboardView').innerHTML=h;const update=()=>{const name=el('dashEx')?.value||defaultEx;const metric=el('dashMetric')?.value||'e1rm';const range=Number(el('dashRange')?.value||0);const rows=aggregateExercise(sessions,name);const cut=range?Date.now()-range*86400000:0;const filt=rows.filter(x=>!cut||new Date(x.date).getTime()>=cut);const pts=filt.map(x=>({value:metric==='e1rm'?x.e1rm:metric==='weight'?x.weight:metric==='volume'?x.volume:metric==='reps'?x.reps:metric==='time'?x.time:x.amrap,label:new Date(x.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})}));el('dashChart').innerHTML=simpleChart(pts,metric)};el('dashEx')?.addEventListener('change',update);el('dashMetric')?.addEventListener('change',update);el('dashRange')?.addEventListener('change',update);update()}

function renderHistory(){getSessions().then(sessions=>{let h=`<div class="h1">History</div><div class="muted">Every logged workout is editable. Your history is scoped to the signed-in account.</div>`;if(!sessions.length)h+='<div class="card muted">No workouts logged yet.</div>';for(const s of sessions.slice().reverse())h+=`<div class="history-item"><div class="row between"><div><b>${esc(s.programName||'Program')}</b><div class="tiny muted">${esc(s.routine)} • ${new Date(s.date).toLocaleDateString()} ${s.durationSec?`• ${Math.round(s.durationSec/60)} min`:''}</div></div><button class="btn small" data-edit-session="${s.id}">Edit</button></div><div class="tiny muted" style="margin-top:7px">${sessionSummary(s).sets} sets • ${Math.round(sessionSummary(s).total).toLocaleString()} effective volume${s.bodyweight?` • BW ${s.bodyweight} lb`:''}</div></div>`;el('historyView').innerHTML=h;document.querySelectorAll('[data-edit-session]').forEach(b=>b.onclick=()=>openSessionEditor(b.dataset.editSession))})}
function openSessionEditor(id){getSessions().then(sessions=>{const s=sessions.find(x=>x.id===id);if(!s)return;let h=`<div class="row between"><div><div class="h2">Edit Workout</div><div class="muted">${esc(s.routine)} • ${new Date(s.date).toLocaleDateString()}</div></div><button class="iconbtn" data-close>✕</button></div><div class="grid2"><label class="label">Date<input id="editDate" class="input" type="date" value="${s.date}"></label><label class="label">Bodyweight<input id="editBw" class="input" type="number" value="${s.bodyweight??''}"></label><label class="label" style="grid-column:1/-1">Notes<textarea id="editNotes" class="input">${esc(s.notes||'')}</textarea></label></div>`;for(const e of s.exercises||[]){h+=`<div class="section-title">${esc(e.name)}</div><div class="card">`;e.sets.forEach((st,i)=>h+=`<div class="set-row"><div class="set-num">${i+1}</div>${e.loadType==='bodyweight'?'<div class="pill">BW</div>':`<input class="input edit-w" data-e="${e.exerciseId}" data-i="${i}" value="${st.weight??''}" inputmode="decimal">`}<input class="input edit-r" data-e="${e.exerciseId}" data-i="${i}" value="${st.reps??''}" inputmode="numeric"><div class="set-status">${st.amrap?'AMRAP':''}</div></div>`);h+='</div>'}h+='<div class="row" style="margin-top:12px"><button class="btn blue" id="saveSessionEdit">Save Changes</button><button class="btn danger" id="deleteSession">Delete Workout</button></div>';showModal(h);el('saveSessionEdit').onclick=async()=>{s.date=el('editDate').value;s.bodyweight=el('editBw').value?Number(el('editBw').value):null;s.notes=el('editNotes').value;for(const e of s.exercises||[]){e.sets.forEach((st,i)=>{const w=document.querySelector(`[data-e="${e.exerciseId}"][data-i="${i}"].edit-w`)?.value;if(w!==undefined)st.weight=w===''?null:Number(w);const rr=document.querySelector(`[data-e="${e.exerciseId}"][data-i="${i}"].edit-r`)?.value;if(rr!==undefined)st.reps=rr===''?null:Number(rr)})}await saveSession(s);closeModal();renderHistory();renderDashboard();notify('Workout updated.','ok')};el('deleteSession').onclick=async()=>{if(!confirm('Delete this workout?'))return;await deleteSession(s.id);closeModal();renderHistory();renderDashboard();notify('Workout deleted.','ok')}})}
async function deleteSession(id){if(storageFallback||!db){const rows=await getSessions();lsSet(localKey('sessions'),rows.filter(x=>x.id!==id));return}await new Promise(resolve=>{const q=db.transaction('sessions','readwrite').objectStore('sessions').delete(id);q.onsuccess=q.onerror=()=>resolve()});if(cloudReady&&currentUser)try{await api(`workout_sessions?id=eq.${encodeURIComponent(id)}`,{method:'DELETE'})}catch(e){console.warn(e)}}

function renderExercises(){getSessions().then(async sessions=>{const progNames=activeRoutines().flatMap(r=>r.exercises.map(e=>e.name));const histNames=sessions.flatMap(s=>(s.exercises||[]).map(e=>e.name));const names=[...new Set([...progNames,...histNames])].sort();let h=`<div class="h1">Exercises</div><div class="muted">Search your exercise library, inspect history and see PRs.</div><input id="exerciseSearch" class="input search" placeholder="Search exercises…" value=""> <div id="exerciseList"></div>`;el('exercisesView').innerHTML=h;const paint=(q='')=>{const use=names.filter(n=>n.toLowerCase().includes(q.toLowerCase()));el('exerciseList').innerHTML=use.map(n=>{const rows=aggregateExercise(sessions,n);const best=Math.max(0,...rows.map(r=>r.e1rm));return`<button class="card" data-exlib="${esc(n)}" style="width:100%;text-align:left"><div class="row between"><b>${esc(n)}</b><span class="pill">${rows.length} sessions</span></div><div class="tiny muted">Best e1RM ${best?best.toFixed(1):'—'}</div></button>`}).join('')||'<div class="card muted">No exercises found.</div>';document.querySelectorAll('[data-exlib]').forEach(b=>b.onclick=()=>openExerciseDetail(b.dataset.exlib,sessions))};el('exerciseSearch').oninput=e=>paint(e.target.value);paint()})}
function openExerciseDetail(name,sessions){const rows=aggregateExercise(sessions,name);const isTime=rows.some(x=>x.runtime==='time');const best=Math.max(0,...rows.map(x=>x.e1rm)),bestWeight=Math.max(0,...rows.map(x=>x.weight)),bestReps=Math.max(0,...rows.map(x=>x.reps)),bestTime=Math.max(0,...rows.map(x=>x.time));const chartRows=rows.map(x=>({value:isTime?x.time:x.e1rm,label:new Date(x.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})}));let h=`<div class="row between"><div><div class="h2">${esc(name)}</div><div class="muted">Detailed exercise history and PRs</div></div><button class="iconbtn" data-close>✕</button></div><div class="kpis"><div class="kpi"><div class="v">${isTime?(bestTime?formatDuration(bestTime):'—'):(best?best.toFixed(1):'—')}</div><div class="l">${isTime?'Best hold':'Best e1RM'}</div></div><div class="kpi"><div class="v">${bestWeight||'—'}</div><div class="l">Best added/top load</div></div><div class="kpi"><div class="v">${isTime?(bestTime?formatDuration(bestTime):'—'):(bestReps||'—')}</div><div class="l">${isTime?'Best hold':'Best reps'}</div></div><div class="kpi"><div class="v">${rows.length}</div><div class="l">Sessions</div></div></div><div class="chart" style="margin-top:12px">${simpleChart(chartRows,isTime?'Hold time':'e1RM')}</div><div style="overflow:auto;margin-top:12px"><table class="table"><thead><tr><th>Date</th><th>Weight</th><th>${isTime?'Time':'Reps'}</th><th>${isTime?'Timed work':'e1RM'}</th><th>Volume</th></tr></thead><tbody>${rows.slice().reverse().map(x=>`<tr><td>${new Date(x.date).toLocaleDateString()}</td><td>${x.weight||'BW'}</td><td>${isTime?formatDuration(x.time):x.reps||'—'}</td><td>${isTime?(x.time?formatDuration(x.time):'—'):(x.e1rm?x.e1rm.toFixed(1):'—')}</td><td>${Math.round(x.volume).toLocaleString()} ${x.runtime==='time'?'lb-sec':'lb-reps'}</td></tr>`).join('')}</tbody></table></div>`;showModal(h)}

function renderProgram(){const p=activeProgram();const syncLabel=currentUser?(programMeta.dirty?'Unsynced local changes':'Synced to cloud'):'Local only';const syncClass=currentUser?(programMeta.dirty?'warn':'green'):'gray';let h=`<div class="h1">Program <span class="pill ${syncClass}" style="vertical-align:middle">${syncLabel}</span></div><div class="muted">Programs are independent. Choose any progression model per exercise; 5/3/1 is one option, not a requirement.</div><div class="section-title">My Programs</div><div class="program-list">${state.library.programs.map(x=>`<div class="program-item ${x.id===p.id?'active':''}"><div class="row between"><div><b>${esc(x.name)}</b><div class="tiny muted">${x.routines.length} workouts${x.id===p.id?' • Active':''}</div></div><div class="program-actions"><button class="btn small" data-select-program="${x.id}">${x.id===p.id?'Active':'Use'}</button><button class="btn small" data-dup-program="${x.id}">Duplicate</button>${state.library.programs.length>1?`<button class="btn small danger-outline" data-del-program="${x.id}">Delete</button>`:''}</div></div></div>`).join('')}</div><div class="program-toolbar" style="margin-top:9px"><button class="btn blue" id="createProgram">+ Create Program</button><button class="btn" id="saveProgram">Save Changes</button></div><div class="section-title">${esc(p.name)}</div><div class="card"><div class="grid2"><label class="label">Program name<input id="programName" class="input" value="${esc(p.name)}"></label><label class="label">Active program<select id="activeProgramSelect" class="input">${state.library.programs.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label></div></div>`;
for(const r of p.routines){h+=renderRoutineEditor(p,r)}h+=`<div class="row" style="margin:10px 0 18px"><button class="btn" id="addRoutine">+ Add Workout</button></div><div class="card"><div class="h2">Backup</div><div class="row"><button class="btn" id="exportData">Export Backup</button><label class="btn">Import Backup<input id="importData" type="file" accept="application/json" hidden></label></div></div>`;el('programView').innerHTML=h;bindProgram()}
function renderRoutineEditor(p,r){let h=`<div class="routine-block"><div class="routine-head"><div class="row between"><div><input class="input" style="font-weight:850" data-rname="${r.id}" value="${esc(r.name)}"><div class="tiny muted">${r.mode==='5/3/1'?'5/3/1 main lift + accessories':'Custom workout'}</div></div><div class="program-actions"><button class="btn small" data-add-ex="${r.id}">+ Exercise</button><button class="btn small danger-outline" data-remove-r="${r.id}">Remove Workout</button></div></div></div><div class="routine-body">`;
if(r.mode==='5/3/1'){const c=r.fiveThreeOne;h+=`<div class="card five"><div class="h2">5/3/1 Settings</div><div class="grid3"><label class="label">Training Max<input class="input" data-r531-tm="${r.id}" value="${c.trainingMax||''}"></label><label class="label">Cycle<input class="input" type="number" data-r531-cycle="${r.id}" value="${c.cycle}"></label><label class="label">Week<input class="input" type="number" min="1" max="4" data-r531-week="${r.id}" value="${c.week}"></label><label class="label">Rounding<input class="input" data-r531-round="${r.id}" value="${c.rounding}"></label><label class="label">TM + / cycle<input class="input" data-r531-inc="${r.id}" value="${c.tmIncrease}"></label><label class="label">Main lift<select class="input" data-r531-main="${r.id}">${r.exercises.filter(e=>e.active).map(e=>`<option value="${e.id}" ${e.id===c.mainLiftId?'selected':''}>${esc(e.name)}</option>`).join('')}</select></label></div><div class="status" style="margin-top:8px">Classic 5/3/1: three prescribed sets plus a separate AMRAP at the third-set weight. Week 4 is a deload.</div></div>`}
for(let i=0;i<r.exercises.length;i++){const ex=r.exercises[i];h+=`<div class="program-ex"><div class="row between"><label class="check"><input type="checkbox" data-active="${r.id}|${ex.id}" ${ex.active?'checked':''}> Active</label><div class="row"><button class="btn small" data-up="${r.id}|${ex.id}">↑</button><button class="btn small" data-down="${r.id}|${ex.id}">↓</button><button class="btn small danger-outline" data-remove-ex="${r.id}|${ex.id}">Remove</button></div></div><div class="program-ex-grid" style="margin-top:8px"><label class="label">Exercise<input class="input" data-en="${r.id}|${ex.id}" value="${esc(ex.name)}"></label><label class="label">Sets<input class="input" data-es="${r.id}|${ex.id}" value="${esc(ex.sets)}"></label><label class="label">Reps / Duration<input class="input" data-er="${r.id}|${ex.id}" value="${esc(ex.reps)}" placeholder="8-12 or 30-60 sec"></label><label class="label">Metric<select class="input" data-emetric="${r.id}|${ex.id}"><option value="reps" ${ex.metric==='reps'?'selected':''}>Reps</option><option value="time" ${ex.metric==='time'?'selected':''}>Time</option></select></label><label class="label">Load<select class="input" data-eload="${r.id}|${ex.id}"><option value="weight" ${ex.loadType==='weight'?'selected':''}>External</option><option value="bodyweight" ${ex.loadType==='bodyweight'?'selected':''}>Bodyweight</option><option value="bodyweight_added" ${ex.loadType==='bodyweight_added'?'selected':''}>BW + added</option></select></label><label class="label">Targets<input class="input" data-et="${r.id}|${ex.id}" value="${esc(ex.targetWeights.join(', '))}" placeholder="70, 70, 70"></label></div><div class="program-ex-grid" style="margin-top:7px"><label class="label">Progression<select class="input" data-ep="${r.id}|${ex.id}"><option value="531" ${ex.progression==='531'?'selected':''}>5/3/1</option><option value="double" ${ex.progression==='double'?'selected':''}>Double progression</option><option value="linear" ${ex.progression==='linear'?'selected':''}>Linear progression</option><option value="bodyweight" ${ex.progression==='bodyweight'?'selected':''}>Bodyweight</option><option value="manual" ${ex.progression==='manual'?'selected':''}>Manual / fixed</option></select></label><label class="label">Rule<select class="input" data-erule="${r.id}|${ex.id}"><option value="all" ${ex.progressionRule==='all'?'selected':''}>Increase all sets</option><option value="last" ${ex.progressionRule==='last'?'selected':''}>Increase last set</option></select></label><label class="label">Increment<input class="input" data-einc="${r.id}|${ex.id}" value="${ex.inc||''}"></label><label class="label">Superset<input class="input" data-esuper="${r.id}|${ex.id}" value="${esc(ex.supersetGroup)}" placeholder="A"></label><label class="label">Rest sec<input class="input" data-erest="${r.id}|${ex.id}" value="${ex.restSec||90}"></label><label class="label">Warm-up sets<input class="input" data-ewarm="${r.id}|${ex.id}" value="${ex.warmupSets||0}"></label></div><div class="program-actions"><label class="check"><input type="checkbox" data-sub-enable="${r.id}|${ex.id}" ${ex.substitutionFor?'checked':''}> Substitution</label><input class="input" style="max-width:260px" data-sub="${r.id}|${ex.id}" value="${esc(ex.substitutionFor)}" placeholder="Original exercise"></div></div>`}h+='</div></div>';return h}
function bindProgram(){const p=activeProgram();document.querySelectorAll('[data-select-program]').forEach(b=>b.onclick=async()=>{state.library.activeProgramId=b.dataset.selectProgram;state.routineId=activeProgram().routines[0]?.id;await saveLibraryLocal();renderAll()});document.querySelectorAll('[data-dup-program]').forEach(b=>b.onclick=async()=>{const src=state.library.programs.find(x=>x.id===b.dataset.dupProgram);const cp=clone(src);cp.id=uid();cp.name=cp.name+' Copy';cp.routines=cp.routines.map(r=>({...r,id:uid(),exercises:r.exercises.map(e=>({...e,id:uid()}))}));state.library.programs.push(cp);state.library.activeProgramId=cp.id;state.routineId=cp.routines[0]?.id;renderProgram()});document.querySelectorAll('[data-del-program]').forEach(b=>b.onclick=async()=>{if(state.library.programs.length<=1)return;if(!confirm('Delete this program? Its historical workouts will remain in History.'))return;state.library.programs=state.library.programs.filter(x=>x.id!==b.dataset.delProgram);if(state.library.activeProgramId===b.dataset.delProgram)state.library.activeProgramId=state.library.programs[0].id;state.routineId=activeProgram().routines[0]?.id||null;renderProgram()});el('createProgram').onclick=()=>{const name=prompt('Program name','New Program');if(!name)return;const pnew={id:uid(),name:name.trim(),active:true,routines:[]};state.library.programs.push(pnew);state.library.activeProgramId=pnew.id;state.routineId=null;renderProgram()};el('programName').oninput=e=>p.name=e.target.value;el('activeProgramSelect').onchange=e=>{state.library.activeProgramId=e.target.value;state.routineId=activeProgram().routines[0]?.id||null;renderProgram()};document.querySelectorAll('[data-add-ex]').forEach(b=>b.onclick=()=>{const r=p.routines.find(x=>x.id===b.dataset.addEx);r.exercises.push({id:uid(),name:'New exercise',sets:'3',reps:'8-12',metric:'reps',targetWeights:[],progression:'double',inc:5,loadType:'weight',bwFactor:1,supersetGroup:'',restSec:90,warmupSets:0,active:true});renderProgram()});el('addRoutine').onclick=()=>{const name=prompt('Workout name','New Workout');if(!name)return;const r={id:uid(),name:name.trim(),mode:'custom',exercises:[]};p.routines.push(r);state.routineId=r.id;renderProgram()};document.querySelectorAll('[data-remove-r]').forEach(b=>b.onclick=()=>{if(!confirm('Remove this workout from the program?'))return;p.routines=p.routines.filter(r=>r.id!==b.dataset.removeR);state.routineId=p.routines[0]?.id||null;renderProgram()});document.querySelectorAll('[data-remove-ex]').forEach(b=>b.onclick=()=>{const [rid,eid]=b.dataset.removeEx.split('|');const r=p.routines.find(x=>x.id===rid);if(!r)return;r.exercises=r.exercises.filter(e=>e.id!==eid);if(r.fiveThreeOne?.mainLiftId===eid)r.fiveThreeOne.mainLiftId=r.exercises[0]?.id||'';renderProgram()});document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>moveEx(p,b.dataset.up,-1));document.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>moveEx(p,b.dataset.down,1));el('saveProgram').onclick=async()=>{try{for(const r of p.routines){r.name=document.querySelector(`[data-rname="${r.id}"]`)?.value.trim()||r.name;if(r.mode==='5/3/1'){r.fiveThreeOne.trainingMax=Number(document.querySelector(`[data-r531-tm="${r.id}"]`)?.value)||0;r.fiveThreeOne.cycle=Number(document.querySelector(`[data-r531-cycle="${r.id}"]`)?.value)||1;r.fiveThreeOne.week=Math.min(4,Math.max(1,Number(document.querySelector(`[data-r531-week="${r.id}"]`)?.value)||1));r.fiveThreeOne.rounding=Number(document.querySelector(`[data-r531-round="${r.id}"]`)?.value)||5;r.fiveThreeOne.tmIncrease=Number(document.querySelector(`[data-r531-inc="${r.id}"]`)?.value)||5;r.fiveThreeOne.mainLiftId=document.querySelector(`[data-r531-main="${r.id}"]`)?.value||r.fiveThreeOne.mainLiftId}for(const ex of r.exercises){const k=`${r.id}|${ex.id}`;ex.active=document.querySelector(`[data-active="${k}"]`)?.checked??ex.active;ex.name=document.querySelector(`[data-en="${k}"]`)?.value.trim()||'Unnamed exercise';ex.sets=document.querySelector(`[data-es="${k}"]`)?.value.trim()||'';ex.reps=document.querySelector(`[data-er="${k}"]`)?.value.trim()||'';ex.metric=document.querySelector(`[data-emetric="${k}"]`)?.value||ex.metric||'reps';ex.loadType=document.querySelector(`[data-eload="${k}"]`)?.value||ex.loadType;ex.targetWeights=parseWeights(document.querySelector(`[data-et="${k}"]`)?.value||'');ex.progression=document.querySelector(`[data-ep="${k}"]`)?.value||'manual';ex.progressionRule=document.querySelector(`[data-erule="${k}"]`)?.value||'all';ex.inc=Number(document.querySelector(`[data-einc="${k}"]`)?.value)||0;ex.supersetGroup=document.querySelector(`[data-esuper="${k}"]`)?.value.trim().toUpperCase()||'';ex.restSec=Number(document.querySelector(`[data-erest="${k}"]`)?.value)||90;ex.warmupSets=Number(document.querySelector(`[data-ewarm="${k}"]`)?.value)||0;ex.substitutionFor=document.querySelector(`[data-sub="${k}"]`)?.value.trim()||''}}const ts=new Date().toISOString();if(!p.name.trim())throw new Error('Program name cannot be empty.');await markProgramDirty(ts);if(cloudReady&&currentUser){const r=await cloudSaveLibrary();if(r.status==='conflict'){notify('Program saved locally, but the cloud version is newer. Review the conflict.','warn');await openProgramConflict(r.remote,r.remoteTs)}else if(r.status==='saved')notify('Program saved and synced.','ok');}else notify('Program saved on this device.','ok');renderProgram();}catch(e){console.error(e);notify('Program could not be saved: '+e.message,'warn')}};el('exportData').onclick=async()=>{const data={version:4,exportedAt:new Date().toISOString(),library:state.library,sessions:await getSessions()};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=`workout-backup-${today()}.json`;a.click();URL.revokeObjectURL(a.href)};el('importData').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());if(data.library)state.library=normalizeProgram function moveEx(p,ref,delta){const [rid,eid]=ref.split('|');const r=p.routines.find(x=>x.id===rid);if(!r)return;const i=r.exercises.findIndex(x=>x.id===eid),j=i+delta;if(i<0||j<0||j>=r.exercises.length)return;[r.exercises[i],r.exercises[j]]=[r.exercises[j],r.exercises[i]];renderProgram()}

async function openSettings(){let cfg=cloudConfig||await getCloudConfig();let body=`<div class="row between"><div><div class="h2">Settings</div><div class="muted">Cloud sync, account and local data.</div></div><button class="iconbtn" data-close>✕</button></div><div class="section-title">Cloud Sync</div><div class="card"><label class="label">Supabase URL<input id="cfgUrl" class="input" value="${esc(cfg?.supabaseUrl||'')}" placeholder="https://your-project.supabase.co"></label><label class="label" style="margin-top:8px">Publishable / anon key<input id="cfgKey" class="input" value="${esc(cfg?.supabaseKey||'')}"></label><div class="row" style="margin-top:10px"><button class="btn blue" id="saveCfg">Save Cloud Settings</button><span class="pill ${cloudReady?'green':''}">${cloudReady?'Connected':'Not configured'}</span></div></div><div class="section-title">Account</div><div id="accountArea" class="card">${currentUser?`<div class="status ok">Signed in as ${esc(currentUser.email||'account')}</div><button class="btn danger" id="signOut" style="margin-top:10px">Sign out</button>`:`<button class="btn blue" id="openSignIn">Sign in / Create Account</button>`}</div><div class="section-title">Data</div><div class="card"><button class="btn" id="settingsExport">Export Backup</button></div>`;showModal(body);el('saveCfg').onclick=async()=>{try{const ok=await saveCloudConfig({supabaseUrl:el('cfgUrl').value,supabaseKey:el('cfgKey').value});if(!ok)throw new Error('Enter a valid Supabase URL and key.');cloudReady=true;updateSettingsButton();notify('Cloud settings saved.','ok');renderSettingsAuthArea()}catch(e){notify(e.message,'warn')}};el('openSignIn')?.addEventListener('click',openAuth);el('signOut')?.addEventListener('click',signOut);el('settingsExport').onclick=async()=>{const data={version:4,exportedAt:new Date().toISOString(),library:state.library,sessions:await getSessions()};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=`workout-backup-${today()}.json`;a.click();closeModal()}}

function openAuth(){let mode='signin';showModal(`<div class="row between"><div><div class="h2" id="authTitle">Sign in</div><div class="muted">Use your Workout Tracker account.</div></div><button class="iconbtn" data-close>✕</button></div><div class="auth-grid" style="margin-top:12px"><input id="authEmail" class="input" type="email" placeholder="Email"><input id="authPassword" class="input" type="password" placeholder="Password"><button class="btn blue" id="authSubmit">Sign in</button><button class="btn ghost" id="authSwitch">Create a new account</button><div id="authMsg" class="tiny muted"></div></div>`);const switcher=()=>{mode=mode==='signin'?'signup':'signin';el('authTitle').textContent=mode==='signin'?'Sign in':'Create account';el('authSubmit').textContent=mode==='signin'?'Sign in':'Create account';el('authSwitch').textContent=mode==='signin'?'Create a new account':'I already have an account'};el('authSwitch').onclick=switcher;el('authSubmit').onclick=async()=>{try{const email=el('authEmail').value.trim(),password=el('authPassword').value;if(!email||!password)throw new Error('Enter email and password.');const d=await auth(mode==='signin'?'token?grant_type=password':'signup',{email,password});if(mode==='signup'&&!d.access_token){el('authMsg').textContent='Account created. Check your email if confirmation is required, then sign in.';return}await signInWithData(d);closeModal()}catch(e){el('authMsg').textContent=e.message}}}

function renderWorkout(){if(!state.currentSessionStart)state.currentSessionStart=Date.now();const p=activeProgram(),r=currentRoutine();if(!p||!r){el('workoutView').innerHTML='<div class="card">Create a program to get started.</div>';return}const is531=r.mode==='5/3/1';const c=r.fiveThreeOne;const pres=is531?five31(r):[];el('headerSub').textContent=`${p.name} • ${r.name}`;const activeCount=r.exercises.filter(e=>e.active).length;let h=`<div class="hero card"><div class="row between"><div><div class="eyebrow">Today</div><div class="h1">${esc(r.name)}</div><div class="muted">${is531?`5/3/1 • ${FIVE_THREE_ONE[c.week].label} • Cycle ${c.cycle}`:'Custom workout • Ready to train'}</div></div><button class="btn" data-view="program" id="changeRoutine">Change</button></div><div class="hero-stats"><div class="hero-stat"><div class="v">${activeCount}</div><div class="l">Exercises</div></div><div class="hero-stat"><div class="v">${r.exercises.filter(e=>e.active&&e.supersetGroup).length?Object.keys(r.exercises.filter(e=>e.active&&e.supersetGroup).reduce((m,e)=>(m[e.supersetGroup]=1,m),{})).length:'—'}</div><div class="l">Supersets</div></div><div class="hero-stat"><div class="v">${is531?`W${c.week}`:'—'}</div><div class="l">Program week</div></div></div></div>`;

h+=`<div class="card"><div class="grid2"><label class="label">Session date<input id="sessionDate" class="input" type="date" value="${state.draft._date||today()}"></label><label class="label">Bodyweight (lb)<input id="sessionBw" class="input" type="number" step="0.1" inputmode="decimal" value="${state.draft._bw??''}" placeholder="Optional"></label></div><label class="label" style="display:block;margin-top:10px">Session notes<textarea id="sessionNotes" class="input" rows="1" placeholder="How are you feeling today?">${esc(state.draft._notes||'')}</textarea></label></div>`;
if(is531){h+=`<div class="card five"><div class="row between"><div><div class="h2">5/3/1 • ${FIVE_THREE_ONE[c.week].label}</div><div class="tiny muted">Training Max <b>${c.trainingMax||'Set in Program'}</b> • ${r.name}</div></div><span class="pill blue">Cycle ${c.cycle}</span></div><div class="five-grid">${pres.map(t=>`<div class="five-cell ${t.amrap?'amrap':''}"><div class="pct">${Math.round(t.pct*100)}%</div><div class="wt">${t.weight||'—'}</div><div class="tiny">${t.amrap?'AMRAP':'× '+t.reps}</div></div>`).join('')}</div>${!c.trainingMax?'<div class="status warn" style="margin-top:9px">Set your Training Max in Program before starting this lift.</div>':''}</div>`}
const activeEx=r.exercises.filter(e=>e.active&&(!is531||e.id!==c.mainLiftId));const main=is531?mainLift(r):null;if(main)h+=renderWorkoutExercise(main,true,pres);const groups=[];const map={};for(const ex of activeEx){const g=ex.supersetGroup||`solo-${ex.id}`;if(!map[g]){map[g]=[];groups.push(g)}map[g].push(ex)}for(const g of groups){if(g.startsWith('solo-'))h+=renderWorkoutExercise(map[g][0],false);else{h+=`<div class="superset"><div class="superset-head"><div><div class="eyebrow" style="color:#b7abef">Superset ${esc(supersetLabel(g))}</div><div class="h3">Move through the group, then rest</div></div><button class="rest-btn" data-rest="${Math.max(...map[g].map(e=>Number(e.restSec)||90))}">Start Rest</button></div>${map[g].map(ex=>renderWorkoutExercise(ex,false)).join('')}</div>`}}

function renderWorkoutExercise(ex,isMain,pres=[]){const d=getDraft(ex.id);const n=isMain?pres.length:Math.max(stepCount(ex)+Number(ex.warmupSets||0),d.sets?.length||0);const metric=ex.metric||'reps';let h=`<div class="exercise-card ${ex.loadType!=='weight'?'bw':''}"><div class="exercise-head"><div><div class="row"><div class="exercise-name">${esc(ex.name)}</div>${isMain?'<span class="pill blue">Main Lift</span>':''}${!isMain&&metric==='time'?'<span class="pill purple">Time</span>':''}</div><div class="tiny muted">${isMain?'5/3/1 • 3 prescribed sets + AMRAP':`${esc(ex.sets||'')} × ${esc(ex.reps||'')} • ${esc(loadLabel(ex))} • ${metricLabel(ex)}`}</div></div>${ex.supersetGroup&&!isMain?`<span class="pill purple">↔ ${esc(supersetLabel(ex.supersetGroup))}</span>`:''}</div><div class="row" style="margin-top:8px"><button class="rest-btn" data-rest="${Number(ex.restSec)||90}">Rest ${Number(ex.restSec)||90}s</button></div><div class="set-grid">`;for(let i=0;i<n;i++){const st=d.sets?.[i]||{};const t=isMain?pres[i]:null;const warm=i<Number(ex.warmupSets||0);const target=t?.weight??(ex.targetWeights?.[i]??'');const repT=t?.amrap?'AMRAP':(metric==='time'?(t?.reps!=null?formatDuration(t.reps):formatDuration(parseMetricRange(ex.reps,'time').max)):(t?.reps??(parseRange(ex.reps).max||'')));const val=st.reps==null?'':(metric==='time'?formatDuration(st.reps):st.reps);h+=`<div class="set-row ${warm?'warmup':''}"><div class="set-num">${warm?'W'+(i+1):i-Number(ex.warmupSets||0)+1}</div>${ex.loadType==='bodyweight'?'<input class="input set-w" disabled placeholder="BW">':`<input class="input set-w" data-ex="${ex.id}" data-i="${i}" value="${st.weight??''}" inputmode="decimal" placeholder="${target!==''?'target '+target:(ex.loadType==='bodyweight_added'?'added lb':'weight')}">`}<input class="input set-r" data-ex="${ex.id}" data-i="${i}" value="${val}" inputmode="${metric==='time'?'text':'numeric'}" placeholder="${repT||metricUnit(ex)}"><div class="set-status">${target!==''?`Target ${target}`:''}${t?.amrap?'<br><b>AMRAP</b>':''}</div></div>`}return h+'</div></div>'}

function openUserGuide(){
 const guide=`<div class="guide-modal"><div class="row between guide-hero"><div><div class="eyebrow">Help</div><div class="h1">Workout Tracker Guide</div><div class="muted">How the app thinks, not just where the buttons are.</div></div><button class="iconbtn" data-close>✕</button></div>
 <details class="guide-section" open><summary>Getting started</summary><div class="guide-body"><div class="guide-step"><span class="guide-step-num">1</span><div><b>Choose a program.</b> Program → select an existing program or create one.</div></div><div class="guide-step"><span class="guide-step-num">2</span><div><b>Set your routine.</b> Expand a workout only when you need to edit its exercises.</div></div><div class="guide-step"><span class="guide-step-num">3</span><div><b>Train.</b> Workout shows targets; enter what you actually perform.</div></div><div class="guide-step"><span class="guide-step-num">4</span><div><b>Finish & log.</b> Your workout becomes permanent history and feeds Progress.</div></div></div></details>
 <details class="guide-section"><summary>Workout screen</summary><div class="guide-body"><b>Target vs actual:</b> targets come from your program; the boxes are what you actually lifted/did. For bodyweight exercises, only enter added load when applicable. Rest buttons start the timer. Superset labels show exercises intended to alternate.</div></details>
 <details class="guide-section"><summary>Programs & exercises</summary><div class="guide-body">A <b>Program</b> contains workouts. A workout contains exercises. Tap/expand a workout or exercise to reveal editing fields. The default view intentionally hides advanced options to keep normal editing fast. Toggle an exercise off to temporarily remove it without deleting history.</div></details>
 <details class="guide-section"><summary>5/3/1</summary><div class="guide-body">5/3/1 routines use a <b>Training Max</b>, cycle, and week. The app calculates your three prescribed sets plus a separate AMRAP set. Week 4 is the deload. At the end of a cycle, TM changes are presented for approval rather than silently applied.</div></details>
 <details class="guide-section"><summary>Accessory progression</summary><div class="guide-body"><b>Double progression:</b> build reps/time until every programmed set reaches the top of the target range. The app then recommends the configured load or rep/time increase. Recommendations are reviewed before they change your program. Linear and manual progression are also available.</div></details>
 <details class="guide-section"><summary>Reps vs time</summary><div class="guide-body">Choose <b>Reps</b> for movements counted in repetitions and <b>Time</b> for holds such as planks. Timed volume is tracked separately from rep volume, so 60 seconds is never treated as 60 reps. Time accepts seconds or formats such as <b>1:00</b>.</div></details>
 <details class="guide-section"><summary>Bodyweight & added load</summary><div class="guide-body"><b>Bodyweight</b> means no external load entry. <b>Bodyweight + added</b> is for weighted pull-ups/dips and records only the added load while using session bodyweight for effective-load analytics.</div></details>
 <details class="guide-section"><summary>Supersets & rest</summary><div class="guide-body">Give exercises the same Superset Group (for example A) to visually group them. Rest seconds are configured per exercise and can be started directly from the workout screen.</div></details>
 <details class="guide-section"><summary>Progress & history</summary><div class="guide-body">Progress uses logged sessions to show e1RM, load, volume, repetitions, timed work, AMRAP performance, bodyweight and 5/3/1 Training Max history. History is the factual record of what you actually performed.</div></details>
 <details class="guide-section"><summary>Sync & backups</summary><div class="guide-body">When signed in, the cloud program is authoritative across devices. Use <b>Save</b> after program edits and wait for synced status before editing from another device. Workout sessions sync independently. Export a backup before major program changes or app upgrades.</div></details>
 </div>`;
 showModal(guide);
}
function openSettings(){nav('settings')}
function updateSettingsButton(){const b=el('settingsBtn');const u=currentUser?.email||'';b.textContent='⚙';b.title=u?`Signed in as ${u}`:(cloudReady?'Cloud Sync configured':'Cloud Sync not configured');const hu=el('headerUser');if(hu)hu.innerHTML=currentUser?`<span class="avatar">${esc((u||'U').slice(0,1).toUpperCase())}</span><span>${esc(u)}</span>`:''}
async function renderAll(){renderWorkout();await renderDashboard();renderHistory();renderProgram();renderExercises();renderSettingsView()}
document.querySelectorAll('.nav,.nav2').forEach(b=>b.onclick=()=>nav(b.dataset.view));el('settingsBtn').onclick=()=>{if(appReady)openSettings()};el('modal').addEventListener('click',e=>{if(e.target===el('modal'))closeModal()});
boot();
