<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--accent2:#2563eb;--ok:#15803d;--warn:#b45309;--danger:#b91c1c;--soft:#eef2ff;--radius:18px}
*{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);padding-bottom:86px}
button,input,select,textarea{font:inherit} button{cursor:pointer;border:0}.top{position:sticky;top:0;z-index:10;background:rgba(243,244,246,.94);backdrop-filter:blur(12px);padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;font-size:20px}.sub{font-size:12px;color:var(--muted)}
.container{max-width:760px;margin:0 auto;padding:14px}.view{display:none}.view.active{display:block}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:0 3px 12px rgba(17,24,39,.04)}
.h1{font-size:25px;font-weight:800;margin:6px 0}.h2{font-size:17px;font-weight:750;margin:0 0 8px}.muted{color:var(--muted)}.tiny{font-size:12px}.pill{padding:5px 9px;border-radius:999px;background:#f3f4f6;font-size:12px;color:#4b5563}.pill.ok{background:#ecfdf5;color:var(--ok)}.pill.warn{background:#fffbeb;color:var(--warn)}
.btn{padding:11px 13px;border-radius:13px;background:#fff;border:1px solid var(--line);font-weight:700}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.blue{background:var(--accent2);color:#fff;border-color:var(--accent2)}.btn.danger{color:#fff;background:var(--danger)}.btn.small{padding:8px 10px;font-size:13px}.btn.ghost{background:transparent}.iconbtn{width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.tab{padding:10px;border-radius:12px;background:#e5e7eb;font-weight:700;color:#4b5563}.tab.active{background:#111827;color:#fff}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding:8px max(10px,env(safe-area-inset-left)) max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.nav{background:#fff;padding:8px 4px;border-radius:11px;color:#6b7280;font-size:11px;font-weight:700}.nav.active{background:#eef2ff;color:#111827}
.exercise{margin-bottom:12px}.exercise-head{display:flex;gap:8px;align-items:flex-start}.exercise-title{font-weight:800;flex:1}.sets{margin-top:10px;border:1px solid var(--line);border-radius:14px;overflow:hidden}.setrow{display:grid;grid-template-columns:32px 1fr 1fr 54px;gap:6px;align-items:center;padding:8px;border-bottom:1px solid var(--line)}.setrow:last-child{border-bottom:0}.setnum{font-size:12px;color:var(--muted);text-align:center}.input{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:10px;background:#fff}.input:focus{outline:2px solid #c7d2fe;border-color:#818cf8}.setstatus{font-size:11px;text-align:right;color:var(--muted)}
.sticky-actions{position:sticky;bottom:78px;z-index:8;padding:8px 0}.logbig{width:100%;padding:15px;border-radius:16px;background:#111827;color:#fff;font-weight:850;font-size:16px;box-shadow:0 8px 20px rgba(17,24,39,.18)}

.chart{width:100%;height:210px;border:1px solid var(--line);border-radius:14px;background:#fff}.chart svg{width:100%;height:100%}.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:7px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.list{display:flex;flex-direction:column;gap:8px}.listrow{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border-bottom:0}.value{text-align:right;font-weight:750}
.toggle{display:inline-flex;align-items:center;gap:8px}.toggle input{width:20px;height:20px}.program-row{display:grid;grid-template-columns:1.1fr 1.6fr .55fr .8fr .9fr;gap:6px;align-items:center;margin:7px 0}.program-row .input{padding:8px}.section-title{margin:18px 0 8px;font-size:14px;font-weight:800;color:#374151}.program-card{padding:12px;border:1px solid var(--line);border-radius:14px;margin:8px 0;background:#fff}.danger-outline{color:var(--danger);background:#fff1f2;border-color:#fecaca}.five31{border:1px solid #c7d2fe;background:#eef2ff}.five31 .big{font-size:22px;font-weight:850}.five31-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.five31-set{background:#fff;border:1px solid #dbeafe;border-radius:12px;padding:9px;text-align:center}.five31-set .pct{font-size:11px;color:#6b7280}.five31-set .target{font-weight:850}.amrap{border-color:#fde68a;background:#fffbeb}.note{background:#f8fafc;border:1px solid var(--line);padding:10px;border-radius:12px;font-size:12px;color:#4b5563}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}.grid2{grid-template-columns:repeat(2,1fr)}.bottom{max-width:760px;left:50%;transform:translateX(-50%);border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:18px 18px 0 0}}
.modal{position:fixed;inset:0;z-index:50;background:rgba(17,24,39,.5);display:flex;align-items:flex-end;justify-content:center}.modal.hidden{display:none}.modal-card{width:min(760px,100%);background:#fff;border-radius:20px 20px 0 0;padding:18px;box-shadow:0 -10px 30px rgba(0,0,0,.2)}.auth-grid{display:grid;gap:10px}.statusbar{margin:10px 0;padding:10px 12px;border-radius:12px;background:#f8fafc;border:1px solid var(--line);font-size:12px}.statusbar.ok{background:#ecfdf5;border-color:#bbf7d0;color:#166534}.statusbar.warn{background:#fffbeb;border-color:#fde68a;color:#92400e}</style></head>
<body>
<header class="top"><div class="topbar"><div><div class="brand">Workout Tracker</div><div class="sub" id="headerSub">Ready for your next session</div></div><button class="iconbtn" id="settingsBtn" aria-label="Settings">⚙️</button></div></header>
<main class="container">
<section id="view-workout" class="view active"><div id="workoutView"></div></section>
<section id="view-dashboard" class="view"><div id="dashboardView"></div></section>
<section id="view-history" class="view"><div id="historyView"></div></section>
<section id="view-program" class="view"><div id="programView"></div></section>
</main>
<div id="authModal" class="modal hidden"></div>
<nav class="bottom"><button class="nav active" data-view="workout">Workout</button><button class="nav" data-view="dashboard">Progress</button><button class="nav" data-view="history">History</button><button class="nav" data-view="program">Program</button></nav>
<script>window.WORKOUT_CONFIG = window.WORKOUT_CONFIG || {}; </script><script>
const PROGRAM = [
 {key:'Squat',name:'Squat',mode:'5/3/1',fiveThreeOne:{trainingMax:0,cycle:1,week:1,rounding:5,tmIncrease:10,mainLiftId:'Squat-2'},exercises:[
  ['Foam Rolling W/U','','','',0],['Lateral jumps x10 per side','2','plyo warmup','',0],['A1 Barbell Squat','','','',0],['B1 Barbell Squat AMRAP','1','AMRAP','',0],['C1 Romanian DLs','3','','',0],['C2 Single Leg Squat','','6-8 e/s','BW',0],['C2 Side Plank w/Banded Clamshell','2','','BW',0],['Core of choice','3','10-20','',0]
 ]},
 {key:'Bench',name:'Bench',mode:'5/3/1',fiveThreeOne:{trainingMax:0,cycle:1,week:1,rounding:5,tmIncrease:5,mainLiftId:'Bench-1'},exercises:[
  ['10 mins mobility','','','',0],['A1 DB/BB Bench Press','3','week ','',0],['B1 BB Bench Press AMRAP','1','AMRAP','',0],['C1 Bent over DB Row','5','10','',2.5],['C2 YTW on 20 deg bench incline','3','10-12 per','',5],['D1 Tricep Extension','2','15+','',0],['D2 Front Raise DBs','','15+','',0],['E1 Hollow Hold Crunch (supine reach)','2','','',0]
 ]},
 {key:'Deadlift',name:'Deadlift',mode:'5/3/1',fiveThreeOne:{trainingMax:0,cycle:1,week:1,rounding:5,tmIncrease:10,mainLiftId:'Deadlift-1'},exercises:[
  ['10 mins mobility','','','',0],['A1 Deadlift','3','whichever week','',0],['B1 Deadlift AMRAP','1','AMRAP','',0],['C1 DB Bulgarian Split Squat','3','5-8 per/','heavy/3s down',2.5],['Leg Press','3','10','',5],['C2 Incline Bicep Curl','2','','',2.5],['C3 Hollow Hold','','30s','',0],['D1 Prone W pull w/small weights','2','15','',0]
 ]},
 {key:'Shoulders',name:'Shoulders',mode:'custom',exercises:[
  ['10 mins mobility','','','',0],['A1 DB Shoulder Press (neutral)','4','','',2.5],['A2 Bent Over DB Single Arm Row','','10','',2.5],['B1 Close Grip Bench (DB or BB)','3','10','3010 tempo',2.5],['B2 Pushups','','10','BW',0],['C1 Incline DB Chest Flyes','2-3','','',2.5],['C2 Bird Dog holds','','5x per side 5s','BW',0],['Other core of choice','','','',0]
 ]}
].map(r=>({...r, exercises:r.exercises.map((e,i)=>({name:e[0],sets:e[1],reps:e[2],target:e[3],inc:e[4],active:!(r.mode==='5/3/1' && i===3),id:`${r.key}-${i}`,targetWeights:[],progression:'last'}))}));

const FIVE_THREE_ONE = {
  1:{label:'5s',sets:[{pct:.65,reps:5},{pct:.75,reps:5},{pct:.85,reps:5}],amrapMin:5},
  2:{label:'3s',sets:[{pct:.70,reps:3},{pct:.80,reps:3},{pct:.90,reps:3}],amrapMin:3},
  3:{label:'5/3/1',sets:[{pct:.75,reps:5},{pct:.85,reps:3},{pct:.95,reps:1}],amrapMin:1},
  4:{label:'Deload',sets:[{pct:.40,reps:5},{pct:.50,reps:5},{pct:.60,reps:5}],amrapMin:null}
};
function inferMode(r){return r.mode || (['Squat','Bench','Deadlift'].includes(r.key)?'5/3/1':'custom')}
function default531(r, exs){const fallback=(exs||[]).find(e=>e.active && !/AMRAP/i.test(e.name));return {trainingMax:0,cycle:1,week:1,rounding:5,tmIncrease:r.key==='Bench'?5:10,mainLiftId:r.fiveThreeOne?.mainLiftId||fallback?.id||exs?.[0]?.id||''}}
function normalizeProgram(program){
  const rows=Array.isArray(program)?program:PROGRAM;
  return rows.map((r,ri)=>{
    const exs=(r.exercises||[]).map((e,ei)=>({
      id:e.id||`${r.key||'routine'}-${ei}-${uid().slice(0,5)}`,
      name:e.name??'', sets:e.sets??'', reps:e.reps??'', target:e.target??'', inc:Number(e.inc)||0,
      active:e.active!==false, targetWeights:Array.isArray(e.targetWeights)?e.targetWeights.map(Number).filter(n=>!Number.isNaN(n)):parseWeights(e.targetWeights),
      progression:e.progression||'last'
    }));
    const mode=inferMode(r);
    const n={key:r.key||`routine-${ri}-${uid().slice(0,5)}`,name:r.name||`Routine ${ri+1}`,mode,exercises:exs};
    if(mode==='5/3/1'){
      const d=default531(n,exs);
      n.fiveThreeOne={...d,...(r.fiveThreeOne||{})};
      n.fiveThreeOne.trainingMax=Number(n.fiveThreeOne.trainingMax)||0;
      n.fiveThreeOne.cycle=Math.max(1,Number(n.fiveThreeOne.cycle)||1);
      n.fiveThreeOne.week=Math.min(4,Math.max(1,Number(n.fiveThreeOne.week)||1));
      n.fiveThreeOne.rounding=Number(n.fiveThreeOne.rounding)||5;
      n.fiveThreeOne.tmIncrease=Number(n.fiveThreeOne.tmIncrease)||(n.key==='Bench'?5:10);
      const m=exs.find(e=>e.id===n.fiveThreeOne.mainLiftId) || exs.find(e=>e.active&&!/AMRAP/i.test(e.name));
      n.fiveThreeOne.mainLiftId=m?.id||'';
      exs.filter(e=>/AMRAP/i.test(e.name)).forEach(e=>{ if(e.id!==n.fiveThreeOne.mainLiftId)e.active=false; });
    }
    return n;
  });
}
function parseWeights(v){if(Array.isArray(v))return v.map(Number).filter(n=>!Number.isNaN(n));return String(v??'').split(',').map(x=>x.trim()).filter(Boolean).map(Number).filter(n=>!Number.isNaN(n));}
function xNotBlank(x){return String(x).trim()!=='';}
function stepCount(ex){const m=String(ex.sets||'').match(/\d+/);return Math.max(Number(m?.[0])||0,ex.targetWeights?.length||0,3);}
const storedProgram=(()=>{try{return JSON.parse(localStorage.getItem('wt-program')||'null')}catch(e){return null}})();
const state={routine:localStorage.getItem('wt-routine')||'Squat',draft:JSON.parse(localStorage.getItem('wt-draft')||'{}'),program:normalizeProgram(storedProgram||PROGRAM)};
let stateLoadedFromDB=false;
async function loadDurableState(){
  const rec=await idbGet('program','current');
  if(rec?.program){
    const localTs=localStorage.getItem('wt-program-updated')||'';
    const dbTs=rec.updatedAt||'';
    if(!localTs || dbTs>=localTs || !storedProgram){ state.program=normalizeProgram(rec.program); localStorage.setItem('wt-program',JSON.stringify(state.program)); if(dbTs)localStorage.setItem('wt-program-updated',dbTs); }
  }
  const cfg=await idbGet('kv','cloud-config');
  if(cfg?.value?.supabaseUrl && cfg?.value?.supabaseKey){ try{ localStorage.setItem('wt-cloud-config',JSON.stringify(cfg.value)); }catch(e){} }
  stateLoadedFromDB=true;
}
async function saveProgramLocal(updatedAt=new Date().toISOString()){
  try{localStorage.setItem('wt-program',JSON.stringify(state.program));localStorage.setItem('wt-program-updated',updatedAt)}catch(e){}
  return await idbPut('program',{key:'current',program:state.program,updatedAt});
}
async function getSavedCloudConfig(){
  try{const r=await idbGet('kv','cloud-config');if(r?.value?.supabaseUrl&&r?.value?.supabaseKey)return r.value;}catch(e){}
  try{const saved=JSON.parse(localStorage.getItem('wt-cloud-config')||'null');if(saved?.supabaseUrl&&saved?.supabaseKey)return saved;}catch(e){}
  return null;
}

let db=null; let storageFallback=false; let supabase=null; let cloudReady=false; let currentUser=null; let cloudSyncing=false;
const LOCAL_SESSIONS_KEY='wt-sessions';
if(window.WORKOUT_CONFIG && window.WORKOUT_CONFIG.supabaseUrl && !window.WORKOUT_CONFIG.supabaseUrl.includes('YOUR-PROJECT-REF') && window.supabase){try{supabase=window.supabase.createClient(window.WORKOUT_CONFIG.supabaseUrl,window.WORKOUT_CONFIG.supabaseKey);cloudReady=true}catch(e){console.warn('Supabase init failed',e)}}
function openDB(){return new Promise(res=>{try{if(!('indexedDB' in window))throw new Error('IndexedDB unavailable');const q=indexedDB.open('workout-tracker-db',2);q.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('sessions')){const ss=d.createObjectStore('sessions',{keyPath:'id'});ss.createIndex('date','date');ss.createIndex('routine','routine')}if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv',{keyPath:'key'});if(!d.objectStoreNames.contains('program'))d.createObjectStore('program',{keyPath:'key'})};q.onsuccess=e=>{db=e.target.result;storageFallback=false;res(db)};q.onerror=()=>{storageFallback=true;res(null)}}catch(e){storageFallback=true;res(null)}})}
function idbGet(store,key){if(!db)return Promise.resolve(null);return new Promise(res=>{try{const q=db.transaction(store,'readonly').objectStore(store).get(key);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(e){res(null)}})}
function idbPut(store,value){if(!db)return Promise.resolve(false);return new Promise(res=>{try{const q=db.transaction(store,'readwrite').objectStore(store).put(value);q.onsuccess=()=>res(true);q.onerror=()=>res(false)}catch(e){res(false)}})}
function idbDelete(store,key){if(!db)return Promise.resolve(false);return new Promise(res=>{try{const q=db.transaction(store,'readwrite').objectStore(store).delete(key);q.onsuccess=()=>res(true);q.onerror=()=>res(false)}catch(e){res(false)}})}
function tx(mode='readonly'){return db.transaction('sessions',mode).objectStore('sessions')}
function getFallbackSessions(){try{return JSON.parse(localStorage.getItem(LOCAL_SESSIONS_KEY)||'[]')}catch(e){return []}}
function setFallbackSessions(rows){localStorage.setItem(LOCAL_SESSIONS_KEY,JSON.stringify(rows))}
async function getLocalSessions(){if(storageFallback||!db)return getFallbackSessions().sort((a,b)=>new Date(a.date)-new Date(b.date));return new Promise(res=>{const q=tx().getAll();q.onsuccess=()=>res(q.result.sort((a,b)=>new Date(a.date)-new Date(b.date)));q.onerror=()=>{storageFallback=true;res(getFallbackSessions())}})}
async function getSessions(){return getLocalSessions()}
async function putLocalSession(s){if(storageFallback||!db){const rows=getFallbackSessions();const idx=rows.findIndex(x=>x.id===s.id);if(idx>=0)rows[idx]=s;else rows.push(s);setFallbackSessions(rows);return}return new Promise(res=>{const q=tx('readwrite').put(s);q.onsuccess=()=>res();q.onerror=()=>{storageFallback=true;const rows=getFallbackSessions();const idx=rows.findIndex(x=>x.id===s.id);if(idx>=0)rows[idx]=s;else rows.push(s);setFallbackSessions(rows);res()}})}
async function putSession(s){await putLocalSession(s);if(cloudReady&&currentUser&&!cloudSyncing){const {error}=await supabase.from('workout_sessions').upsert({id:s.id,user_id:currentUser.id,session_date:s.date,routine:s.routine,payload:s,updated_at:new Date().toISOString()});if(error)console.warn('Cloud session sync failed',error)}}
async function loadCloudState(){if(!cloudReady||!currentUser)return;cloudSyncing=true;try{const [{data:remoteSessions,error:sesErr},{data:remoteProgram,error:progErr}]=await Promise.all([supabase.from('workout_sessions').select('id,session_date,routine,payload,updated_at').order('session_date',{ascending:true}),supabase.from('workout_programs').select('program,updated_at').maybeSingle()]);if(sesErr)throw sesErr;if(progErr)throw progErr;const local=await getLocalSessions();const map=new Map(local.map(x=>[x.id,x]));for(const x of remoteSessions||[]){const r=x.payload||{id:x.id,date:x.session_date,routine:x.routine};if(!map.has(r.id))map.set(r.id,r)}const merged=[...map.values()].sort((a,b)=>new Date(a.date)-new Date(b.date));if(storageFallback||!db)setFallbackSessions(merged);else for(const row of merged)await putLocalSession(row);const localProgram=(()=>{try{return JSON.parse(localStorage.getItem('wt-program')||'null')}catch(e){return null}})();const localProgramUpdated=localStorage.getItem('wt-program-updated')||'';const remoteProgramUpdated=remoteProgram?.updated_at||'';if(remoteProgram?.program&&(!localProgram||!localProgramUpdated||remoteProgramUpdated>localProgramUpdated)){state.program=normalizeProgram(remoteProgram.program);localStorage.setItem('wt-program',JSON.stringify(state.program));localStorage.setItem('wt-program-updated',remoteProgramUpdated||new Date().toISOString())}else if(localProgram){const ts=localProgramUpdated||new Date().toISOString();await supabase.from('workout_programs').upsert({user_id:currentUser.id,program:state.program,updated_at:ts})}for(const row of merged)await supabase.from('workout_sessions').upsert({id:row.id,user_id:currentUser.id,session_date:row.date,routine:row.routine,payload:row,updated_at:new Date().toISOString()})}catch(e){console.warn('Cloud load/sync failed',e);notify('Cloud sync failed. Your local data is still safe.','warn')}finally{cloudSyncing=false;updateAuthUI();await renderAll()}}
async function syncProgramToCloud(){
  const updatedAt=new Date().toISOString();
  await saveProgramLocal(updatedAt);
  if(!cloudReady||!currentUser)return {ok:false,localOnly:true};
  const {error}=await supabase.from('workout_programs').upsert({user_id:currentUser.id,program:state.program,updated_at:updatedAt});
  if(error){
    console.warn('Program sync failed',error);
    notify('Program saved locally. Cloud save failed.','warn');
    return {ok:false,localOnly:true,error};
  }
  return {ok:true};
}
function notify(msg,type='ok'){const n=document.createElement('div');n.className=`statusbar ${type}`;n.textContent=msg;document.querySelector('.container').prepend(n);setTimeout(()=>n.remove(),3500)}
async function openAuth(){
  if(!cloudReady){
    const url=prompt('Enter your Supabase Project URL');
    if(!url)return;
    const key=prompt('Enter your Supabase publishable key');
    if(!key)return;
    try{
      const cfg={supabaseUrl:url.trim(),supabaseKey:key.trim()};
      localStorage.setItem('wt-cloud-config',JSON.stringify(cfg));
      await idbPut('kv',{key:'cloud-config',value:cfg});
      try{
        if(!window.supabase){
          await new Promise((resolve,reject)=>{
            if(document.querySelector('script[data-supabase-loader="1"]')){
              const wait=setInterval(()=>{if(window.supabase){clearInterval(wait);resolve();}},25);
              setTimeout(()=>{clearInterval(wait);reject(new Error('Supabase library load timed out'));},10000);
              return;
            }
            const s=document.createElement('script');s.dataset.supabaseLoader='1';s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=resolve;s.onerror=()=>reject(new Error('Could not load Supabase client library'));document.head.appendChild(s);
          });
        }
        supabase=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey);
        cloudReady=true;
        await initCloud();
        updateAuthUI();
        notify('Cloud sync connected.','ok');
      }catch(e){
        alert('Cloud settings were saved, but the Supabase library could not be connected. '+(e?.message||e));
      }
    }catch(e){
      alert('Could not save cloud settings on this device.');
    }

function metricChart(allSets,ex,metric){const pts=allSets.filter(x=>x.name===ex).sort((a,b)=>new Date(a.date)-new Date(b.date));if(!pts.length)return '<div class="muted" style="padding:16px">No data for this exercise yet.</div>';const byDate={};for(const x of pts){const k=x.date;(byDate[k] ||= []).push(x)}const vals=Object.entries(byDate).map(([date,arr])=>{let value=0;if(metric==='e1rm')value=Math.max(...arr.map(x=>x.e1rm||0));if(metric==='weight')value=Math.max(...arr.map(x=>Number(x.weight)||0));if(metric==='volume')value=arr.reduce((a,x)=>a+(Number(x.weight)||0)*(Number(x.reps)||0),0);if(metric==='reps')value=Math.max(...arr.map(x=>Number(x.reps)||0));if(metric==='amrap')value=Math.max(...arr.filter(x=>x.amrap).map(x=>Number(x.reps)||0),0);return{date,value,label:new Date(date).toLocaleDateString(undefined,{month:'short',day:'numeric'})}}).filter(x=>x.value||metric!=='amrap');return simpleValueChart(vals,metric==='e1rm'?'e1RM':metric==='weight'?'Weight':metric==='volume'?'Volume':metric==='reps'?'Reps':'AMRAP reps',true)}
function simpleValueChart(pts,title,showDates=false){if(!pts?.length)return '<div class="muted" style="padding:16px">No data yet.</div>';const w=620,h=210,p=32,vals=pts.map(x=>Number(x.value)||0),min=Math.min(...vals),max=Math.max(...vals),span=max-min||1;const path=pts.map((x,i)=>{const px=p+i*(w-2*p)/Math.max(pts.length-1,1);const py=h-p-(x.value-min)/span*(h-2*p);return(i?'L':'M')+px.toFixed(1)+','+py.toFixed(1)}).join(' ');const dots=pts.map((x,i)=>{const px=p+i*(w-2*p)/Math.max(pts.length-1,1);const py=h-p-(x.value-min)/span*(h-2*p);return`<circle cx="${px}" cy="${py}" r="4" fill="#2563eb"><title>${esc(x.label||'')} ${Number(x.value).toFixed(1)}</title></circle>`}).join('');const first=pts[0]?.label||'',last=pts[pts.length-1]?.label||'';return`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" stroke="#d1d5db"/><path d="${path}" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${dots}<text x="${p}" y="18" font-size="12" fill="#6b7280">${max.toFixed(metric==='volume'?0:1)}</text><text x="${p}" y="${h-4}" font-size="12" fill="#6b7280">${min.toFixed(metric==='volume'?0:1)}</text>${showDates?`<text x="${p}" y="${h-4}" dx="36" font-size="11" fill="#6b7280">${esc(first)}</text><text x="${w-p}" y="${h-4}" text-anchor="end" font-size="11" fill="#6b7280">${esc(last)}</text>`:''}<text x="${w-p}" y="18" text-anchor="end" font-size="12" fill="#6b7280">${esc(title)}</text></svg>`}
async function renderHistory(){const ss=(await getSessions()).slice().reverse();let h='<div class="h1">History</div><div class="muted">Tap a session to inspect what you actually did.</div><div class="list" style="margin-top:12px">';for(const s of ss){const sets=s.exercises.reduce((a,e)=>a+e.sets.length,0);h+=`<button class="card" data-session="${s.id}" style="text-align:left;width:100%"><div class="row between"><b>${esc(s.routine)}</b><span class="pill">${sets} sets</span></div><div class="tiny muted">${new Date(s.date).toLocaleDateString()} ${s.cycle?`• Cycle ${s.cycle}, Week ${s.week}`:''} ${s.notes?'• '+esc(s.notes):''}</div></button>`}h+=ss.length?'':'<div class="card muted">No workouts logged yet.</div>';h+='</div>';el('historyView').innerHTML=h;document.querySelectorAll('[data-session]').forEach(b=>b.onclick=async()=>{const s=(await getSessions()).find(x=>x.id===b.dataset.session);alert(s.exercises.map(e=>e.name+'\n'+e.sets.map((x,i)=>`Set ${i+1}: ${x.weight??'—'} × ${x.reps??'—'}`).join('\n')).join('\n\n'))})}
function programRow(r,ex,index){const targets=(ex.targetWeights||[]).join(', ');return`<div class="program-card" data-pcard="${r.key}|${ex.id}"><div class="row between"><div class="row"><input type="checkbox" data-pactive="${r.key}|${ex.id}" ${ex.active?'checked':''}><b>${index+1}. ${esc(ex.name||'New exercise')}</b></div><div class="row"><button class="btn small" data-moveup="${r.key}|${ex.id}">↑</button><button class="btn small" data-movedown="${r.key}|${ex.id}">↓</button><button class="btn small danger-outline" data-remove="${r.key}|${ex.id}">Remove</button></div></div><div class="grid2" style="margin-top:10px"><label class="tiny muted">Exercise<input class="input" data-pname="${r.key}|${ex.id}" value="${esc(ex.name)}"></label><label class="tiny muted">Sets<input class="input" data-psets="${r.key}|${ex.id}" value="${esc(ex.sets||'')}" placeholder="3"></label><label class="tiny muted">Rep target<input class="input" data-preps="${r.key}|${ex.id}" value="${esc(ex.reps||'')}" placeholder="8-10"></label><label class="tiny muted">Target weight / set<input class="input" data-ptargets="${r.key}|${ex.id}" value="${esc(targets)}" placeholder="225, 235, 245"></label><label class="tiny muted">Progression<input class="input" data-pinc="${r.key}|${ex.id}" value="${esc(ex.inc||'')}" inputmode="decimal" placeholder="+5"></label><label class="tiny muted">Rule<select class="input" data-prule="${r.key}|${ex.id}"><option value="last" ${ex.progression==='last'?'selected':''}>Add to last set</option><option value="all" ${ex.progression==='all'?'selected':''}>Add to every set</option><option value="none" ${ex.progression==='none'?'selected':''}>No automatic increase</option></select></label></div><label class="tiny muted" style="display:block;margin-top:8px">Notes / cue<input class="input" data-ptarget="${r.key}|${ex.id}" value="${esc(ex.target||'')}" placeholder="Tempo, load cue, equipment, etc."></label></div>`}
function five31Editor(r){const cfg=r.fiveThreeOne||default531(r,r.exercises);const options=r.exercises.filter(e=>e.active&&!/AMRAP/i.test(e.name));return`<div class="card five31"><div class="h2">5/3/1 Settings</div><div class="grid2"><label class="tiny muted">Training Max<input class="input" data-531tm="${r.key}" value="${cfg.trainingMax||''}" inputmode="decimal" placeholder="e.g. 315"></label><label class="tiny muted">Current cycle<input class="input" data-531cycle="${r.key}" value="${cfg.cycle||1}" type="number" min="1"></label><label class="tiny muted">Current week<input class="input" data-531week="${r.key}" value="${cfg.week||1}" type="number" min="1" max="4"></label><label class="tiny muted">Weight rounding<input class="input" data-531round="${r.key}" value="${cfg.rounding||5}" inputmode="decimal" placeholder="5"></label><label class="tiny muted">TM increase / cycle<input class="input" data-531inc="${r.key}" value="${cfg.tmIncrease||5}" inputmode="decimal"></label><label class="tiny muted">Main lift<select class="input" data-531main="${r.key}">${options.map(e=>`<option value="${e.id}" ${e.id===cfg.mainLiftId?'selected':''}>${esc(e.name)}</option>`).join('')}</select></label></div><div class="note" style="margin-top:10px">Classic 5/3/1 with <b>3 prescribed sets + a separate AMRAP set at the third-set weight</b>. Week 4 is a deload with no AMRAP.</div></div>`}
function renderProgram(){let h='<div class="h1">Program</div><div class="muted">This is the master program. 5/3/1 lifts generate their targets automatically; accessories use their own progression rules.</div>';for(const r of state.program){h+=`<div class="section-title row between"><span>${esc(r.name)} ${r.mode==='5/3/1'?'<span class="pill">5/3/1</span>':''}</span><button class="btn small" data-addex="${r.key}">+ Exercise</button></div>`;if(r.mode==='5/3/1')h+=five31Editor(r);h+=`<div class="card">${r.exercises.length?r.exercises.map((ex,i)=>programRow(r,ex,i)).join(''):'<div class="muted">No exercises yet.</div>'}</div>`}h+=`<div class="row" style="margin:10px 0 18px"><button class="btn primary" id="saveProgram">Save Program</button><button class="btn" id="addRoutine">+ Routine</button></div><div class="section-title">Data</div><div class="card grid2"><button class="btn" id="exportData">Export Backup</button><label class="btn" style="text-align:center">Import Backup<input id="importData" type="file" accept="application/json" hidden></label></div><div class="note">Backups include your program and workout history. Cloud sync runs automatically when signed in.</div>`;el('programView').innerHTML=h;bindProgram()}
function findExercise(rKey,id){const r=state.program.find(x=>x.key===rKey);return {r,ex:r?.exercises.find(x=>x.id===id)}}
function bindProgram(){
  document.querySelectorAll('[data-addex]').forEach(b=>b.onclick=()=>{const r=state.program.find(x=>x.key===b.dataset.addex);r.exercises.push({id:`${r.key}-${uid().slice(0,8)}`,name:'New exercise',sets:'3',reps:'8-10',target:'',inc:0,active:true,targetWeights:[],progression:'last'});renderProgram()});
  document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const [rk,id]=b.dataset.remove.split('|');const {r,ex}=findExercise(rk,id);if(!r||!ex)return;if(!confirm(`Remove ${ex.name} from ${r.name}?`))return;r.exercises=r.exercises.filter(x=>x.id!==id);if(r.mode==='5/3/1'&&r.fiveThreeOne?.mainLiftId===id)r.fiveThreeOne.mainLiftId=r.exercises.find(e=>e.active&&!/AMRAP/i.test(e.name))?.id||'';renderProgram()});
  document.querySelectorAll('[data-moveup]').forEach(b=>b.onclick=()=>moveExercise(b.dataset.moveup,-1));
  document.querySelectorAll('[data-movedown]').forEach(b=>b.onclick=()=>moveExercise(b.dataset.movedown,1));
  el('addRoutine').onclick=()=>{const name=prompt('Routine name');if(!name)return;const key=`routine-${Date.now()}`;state.program.push({key,name:name.trim(),mode:'custom',exercises:[]});state.routine=key;renderProgram()};
  el('saveProgram').onclick=async()=>{
    try{
      for(const r of state.program){
        if(r.mode==='5/3/1'){
          const c=r.fiveThreeOne||default531(r,r.exercises);
          c.trainingMax=Number(document.querySelector(`[data-531tm="${r.key}"]`)?.value)||0;
          c.cycle=Math.max(1,Number(document.querySelector(`[data-531cycle="${r.key}"]`)?.value)||1);
          c.week=Math.min(4,Math.max(1,Number(document.querySelector(`[data-531week="${r.key}"]`)?.value)||1));
          c.rounding=Number(document.querySelector(`[data-531round="${r.key}"]`)?.value)||5;
          c.tmIncrease=Number(document.querySelector(`[data-531inc="${r.key}"]`)?.value)||5;
          c.mainLiftId=document.querySelector(`[data-531main="${r.key}"]`)?.value||c.mainLiftId;
          r.fiveThreeOne=c;
        }
        r.exercises.forEach(ex=>{
          const key=`${r.key}|${ex.id}`;
          ex.active=document.querySelector(`[data-pactive="${key}"]`)?.checked??ex.active;
          ex.name=document.querySelector(`[data-pname="${key}"]`)?.value.trim()||'Unnamed exercise';
          ex.sets=document.querySelector(`[data-psets="${key}"]`)?.value.trim()||'';
          ex.reps=document.querySelector(`[data-preps="${key}"]`)?.value.trim()||'';
          ex.targetWeights=parseWeights(document.querySelector(`[data-ptargets="${key}"]`)?.value||'');
          ex.inc=Number(document.querySelector(`[data-pinc="${key}"]`)?.value)||0;
          ex.progression=document.querySelector(`[data-prule="${key}"]`)?.value||'last';
          ex.target=document.querySelector(`[data-ptarget="${key}"]`)?.value.trim()||'';
        });
      }
      const updatedAt=new Date().toISOString();
      const durable=await saveProgramLocal(updatedAt);
      state.draft={};
      saveDraft();
      let cloudSaved=false;
      if(cloudReady&&currentUser){
        const {error}=await supabase.from('workout_programs').upsert({user_id:currentUser.id,program:state.program,updated_at:updatedAt});
        if(error){
          console.warn('Program cloud save failed',error);
          notify('Program saved on this device. Cloud save failed.','warn');
        } else {
          cloudSaved=true;
        }
      }
      await renderAll();
      notify(cloudSaved?`Program saved and synced. ${durable?'Local backup also saved.':''}`:`Program saved${durable?' locally and in app storage':' locally only'}.`,'ok');
    }catch(err){
      console.error('Program save failed',err);
      notify('Program could not be saved: '+(err?.message||String(err)),'warn');
    }
  };
  el('exportData').onclick=async()=>{const payload={version:3,exportedAt:new Date().toISOString(),program:state.program,sessions:await getSessions()};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download=`workout-backup-${today()}.json`;a.click()};
  el('importData').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const data=JSON.parse(await f.text());if(data.program)state.program=normalizeProgram(data.program);if(Array.isArray(data.sessions))for(const sess of data.sessions)await putSession(sess);await saveProgramLocal();await syncProgramToCloud();await renderAll();notify('Backup imported.','ok')}catch(err){alert('Could not import that backup file.')}}
}
function moveExercise(ref,delta){const [rk,id]=ref.split('|');const r=state.program.find(x=>x.key===rk);if(!r)return;const i=r.exercises.findIndex(x=>x.id===id),j=i+delta;if(i<0||j<0||j>=r.exercises.length)return;[r.exercises[i],r.exercises[j]]=[r.exercises[j],r.exercises[i]];renderProgram()}
function moveExercise(ref,delta){const [rk,id]=ref.split('|');const r=state.program.find(x=>x.key===rk);if(!r)return;const i=r.exercises.findIndex(x=>x.id===id),j=i+delta;if(i<0||j<0||j>=r.exercises.length)return;[r.exercises[i],r.exercises[j]]=[r.exercises[j],r.exercises[i]];renderProgram()}
function nav(view){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===`view-${view}`));document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='workout')renderWorkout();if(view==='dashboard')renderDashboard();if(view==='history')renderHistory();if(view==='program')renderProgram()}
async function renderAll(){await renderWorkout();await renderDashboard();await renderHistory();renderProgram()}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>nav(b.dataset.view));
el('settingsBtn').onclick=()=>{if(currentUser){if(confirm(`Signed in as ${currentUser.email}. Sign out?`))signOut()}else openAuth()};
async function bootApp(){
  try{
    await openDB();
    await loadDurableState();
    await renderAll();
    document.getElementById('bootError').style.display='none';
  }catch(err){
    console.error('Workout Tracker boot error',err);
    const b=document.getElementById('bootError');
    b.textContent='Workout Tracker could not start: '+(err?.message||String(err));
    b.style.display='block';
  }
  try{
    let cfg=window.WORKOUT_CONFIG||{};
    try{ const saved=await getSavedCloudConfig(); if(saved) cfg=saved; }catch(e){}
    if(!cfg.supabaseUrl || !cfg.supabaseKey || String(cfg.supabaseUrl).includes('YOUR-PROJECT-REF') || String(cfg.supabaseKey).includes('YOUR-PUBLISHABLE-KEY')){
      try{
        const r=await fetch('config.js',{cache:'no-store'});
        if(r.ok){
          const txt=await r.text();
          const m=txt.match(/supabaseUrl\s*:\s*['"]([^'"]+)['"][\s\S]*?supabaseKey\s*:\s*['"]([^'"]+)['"]/);
          if(m){ cfg={supabaseUrl:m[1],supabaseKey:m[2]}; await idbPut('kv',{key:'cloud-config',value:cfg}); }
        }
      }catch(e){}
    }
    const configured=!!cfg.supabaseUrl && !!cfg.supabaseKey && !String(cfg.supabaseUrl).includes('YOUR-PROJECT-REF') && !String(cfg.supabaseKey).includes('YOUR-PUBLISHABLE-KEY');
    if(configured){
      try{localStorage.setItem('wt-cloud-config',JSON.stringify(cfg))}catch(e){}
      await idbPut('kv',{key:'cloud-config',value:cfg});
      if(!window.supabase){
        await new Promise((resolve,reject)=>{
          if(document.querySelector('script[data-supabase-loader="1"]')){
            const wait=setInterval(()=>{if(window.supabase){clearInterval(wait);resolve();}},25);
            setTimeout(()=>{clearInterval(wait);reject(new Error('Could not load Supabase client library'))},10000);
            return;
          }
          const s=document.createElement('script');
          s.dataset.supabaseLoader='1';
          s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
          s.onload=resolve;
          s.onerror=()=>reject(new Error('Could not load Supabase client library'));
          document.head.appendChild(s);
        });
      }
      if(!window.supabase) throw new Error('Supabase client library did not load');
      if(!supabase) supabase=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey);
      cloudReady=true;
      await initCloud();
    } else {
      console.warn('Cloud sync not configured.');
      updateAuthUI();
    }
  }catch(e){
    console.warn('Optional cloud initialization failed',e);
    cloudReady=false;
    updateAuthUI();
  }
}
bootApp();

</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
